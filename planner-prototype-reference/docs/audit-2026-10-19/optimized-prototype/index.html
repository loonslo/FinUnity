  --ink: #141413;     --ink-soft: #6f6a5f; --ink-faint: #726d60;
  --hair: #e2ddd1;    --rule: #cfc8b8;
  --olive: #5a6247;   --olive-deep: #454b36; --olive-tint: #edefe6;
  --up: #195a46;      --up-tint: #e9efe8;
  --down: #94503f;    --down-tint: #f7eae5;
  --warn: #86692a;    --warn-tint: #f6efdf;
  --gold: #c0a06a;    --on-accent: #fff;
  --shadow: #0000001a;

  /* 派生色：保持在同一色相里，不另起炉灶 */
  --olive-soft: color-mix(in oklab, var(--olive) 46%, var(--surface));
  --olive-wash: color-mix(in oklab, var(--olive) 14%, var(--surface));
  --scrim: #141413a6;

  --r-card: 8px;
  --r-ctl: 7px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

/* 暗色：项目既有的「浓咖啡」底，不是反色 */
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #231e19;  --surface: #2a241e;  --tint: #322b24;
  --ink: #eee7da;     --ink-soft: #aca394; --ink-faint: #a3998a;
  --hair: #3f382f;    --rule: #554b40;
  --olive: #a1ab7c;   --olive-deep: #c0ca9e; --olive-tint: #2d2f24;
  --up: #7ac7a2;      --up-tint: #233229;
  --down: #e39383;    --down-tint: #3b2721;
  --warn: #e8b36f;    --warn-tint: #3a2f1f;
  --on-accent: #231e19;
  --shadow: #00000066;
  --scrim: #000000b3;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 15px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 400 1rem/1.75 var(--font-sans);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
/* 纸面颗粒：极轻，只为让底色不是死平的一块 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .045;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .2  0 0 0 0 .12  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
:root[data-theme="dark"] body::before { opacity: .06; mix-blend-mode: screen; }

button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; border-radius: 4px; }
::placeholder { color: var(--ink-faint); opacity: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.tnum { font-variant-numeric: tabular-nums lining-nums; }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }

/* ============================================================
   外壳：左侧「每月一圈」导航 + 主栏。窄屏退化为底部标签栏。
   ============================================================ */
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; align-self: start; display: flex; flex-direction: column; gap: 24px;
  padding: 26px 16px 18px 22px; border-right: 1px solid var(--hair);
  background: color-mix(in oklab, var(--ground) 82%, var(--olive-tint));
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; padding-left: 4px; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 9px; background: var(--olive); color: var(--on-accent);
  display: grid; place-items: center; font: 400 28px/1 var(--font-display);
  box-shadow: inset 0 0 0 1px #ffffff26, 0 1px 0 var(--olive-deep);
}
.brand b { display: block; font: 700 19px/1.1 var(--font-sans); letter-spacing: .01em; }
.brand small { display: block; margin-top: 3px; color: var(--ink-soft); font-size: 13px; }

.rail-label { font: 600 12.5px/1 var(--font-sans); letter-spacing: .08em; color: var(--ink-faint); padding: 0 12px; margin-bottom: 6px; }
.rail-home { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--r-ctl); text-decoration: none; font-weight: 600; }
.rail-home svg { color: var(--ink-soft); }
.rail a[aria-current="page"] { background: var(--olive-tint); box-shadow: inset 3px 0 0 var(--olive); }
.rail a:not([aria-current="page"]):hover { background: color-mix(in oklab, var(--olive-tint) 60%, transparent); }

.flow { position: relative; margin-top: 2px; }
.flow::before { content: ""; position: absolute; left: 18px; top: 22px; bottom: 22px; border-left: 1.5px dashed var(--rule); }
.flow a { position: relative; display: grid; grid-template-columns: 14px 1fr; gap: 14px; padding: 11px 12px; border-radius: var(--r-ctl); text-decoration: none; }
.flow .dot { width: 13px; height: 13px; margin-top: 7px; border-radius: 50%; background: var(--ground); border: 1.5px solid var(--rule); position: relative; z-index: 1; }
.flow .done .dot { background: var(--up); border-color: var(--up); }
.flow a[aria-current="page"] .dot { background: var(--olive); border-color: var(--olive); box-shadow: 0 0 0 4px color-mix(in oklab, var(--olive) 20%, transparent); }
.flow .t { display: block; font-weight: 600; line-height: 1.4; }
.flow .s { display: block; color: var(--ink-soft); font-size: 13px; line-height: 1.45; margin-top: 1px; }

.rail-foot { margin-top: auto; display: grid; gap: 10px; padding: 0 4px; }
.rail-foot p { font-size: 12.5px; line-height: 1.55; color: var(--ink-soft); }
.rail-foot .btn { justify-content: flex-start; }

.main { position: relative; z-index: 1; min-width: 0; padding: 0 52px 140px; }
.wrap { max-width: 1120px; margin: 0 auto; }

.topbar { display: flex; align-items: center; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--hair); }
.topbar .who { color: var(--ink-soft); font-size: 14px; }
.topbar .who b { color: var(--ink); font-weight: 600; }
.sp { flex: 1; }
.iconbtn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--rule);
  background: var(--surface); border-radius: var(--r-ctl); font: 600 14px/1 var(--font-sans); transition: border-color .16s;
}
.iconbtn:hover { border-color: var(--olive); }
.iconbtn .dotmark { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
.iconbtn.sq { width: 40px; padding: 0; justify-content: center; }

/* ============================================================
   「下一步」条：每个页面顶部只给一件事
   ============================================================ */
.next {
  display: flex; align-items: center; gap: 18px; margin: 22px 0 0; padding: 16px 20px;
  background: var(--surface); border: 1px solid var(--hair); border-left: 4px solid var(--gold); border-radius: 6px;
}
.next .k { flex: none; font: 700 12.5px/1 var(--font-sans); letter-spacing: .1em; color: var(--ink-soft); }
.next p { flex: 1; min-width: 0; }
.next p small { display: block; color: var(--ink-soft); font-size: 13.5px; margin-top: 2px; }
.next.ok { border-left-color: var(--up); background: var(--up-tint); }
.next.warn { border-left-color: var(--warn); background: var(--warn-tint); }
.next .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ============================================================
   页头
   ============================================================ */
.page-head { padding: 36px 0 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; }
.eyebrow { font: 700 13px/1.4 var(--font-sans); letter-spacing: .08em; color: var(--olive); }
.title { font: 400 clamp(34px, 4vw, 50px)/1.15 var(--font-display); letter-spacing: -.005em; margin-top: 6px; }
.lede { color: var(--ink-soft); margin-top: 8px; max-width: 44em; }
.page-head .meta { text-align: right; font-size: 13.5px; color: var(--ink-soft); display: grid; gap: 6px; justify-items: end; }

/* ============================================================
   通用部件
   ============================================================ */
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card); box-shadow: 0 1px 0 var(--hair); }
.pad { padding: 24px 28px; }
.sec { margin-top: 44px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-head h2 { font: 700 21px/1.3 var(--font-sans); letter-spacing: .005em; }
.sec-head h2 .no { font: 400 30px/1 var(--font-display); color: var(--olive); margin-right: 10px; vertical-align: -3px; }
.sec-head p { color: var(--ink-soft); font-size: 14px; }
.muted { color: var(--ink-soft); }
.faint { color: var(--ink-faint); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.stack { display: grid; gap: 16px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 25px; padding: 0 10px; border-radius: 99px;
  font: 600 13px/1 var(--font-sans); letter-spacing: .02em; border: 1px solid transparent; white-space: nowrap; background: var(--tint); color: var(--ink-soft);
}
.chip.up { background: var(--up-tint); color: var(--up); }
.chip.warn { background: var(--warn-tint); color: var(--warn); }
.chip.down { background: var(--down-tint); color: var(--down); }
.chip.olive { background: var(--olive-tint); color: var(--olive); }
.chip.plain { background: transparent; border-color: var(--rule); color: var(--ink-soft); }
.chip.dashed { background: transparent; border: 1px dashed var(--rule); color: var(--ink-faint); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px;
  border-radius: var(--r-ctl); border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  font: 600 14.5px/1.2 var(--font-sans); text-decoration: none; transition: border-color .16s, background .16s, transform .16s;
}
.btn:hover { border-color: var(--olive); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--olive); border-color: var(--olive-deep); color: var(--on-accent); box-shadow: 0 1px 0 var(--olive-deep); }
.btn.primary:hover { background: var(--olive-deep); }
:root[data-theme="dark"] .btn.primary:hover { background: color-mix(in oklab, var(--olive) 88%, #fff); }
.btn.danger { background: var(--down); border-color: var(--down); color: #fff; }
:root[data-theme="dark"] .btn.danger { color: #2b1913; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--olive); padding: 0 10px; }
.btn.ghost:hover { background: var(--olive-tint); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn[disabled]:hover { border-color: var(--rule); }
.btn.primary[disabled]:hover { border-color: var(--olive-deep); background: var(--olive); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--olive); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* 账本引线：名称 ······ 金额 */
.ld { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; }
.ld > i { flex: 1; border-bottom: 1.5px dotted var(--rule); transform: translateY(-4px); min-width: 20px; }
.ld > b { font-weight: 600; font-variant-numeric: tabular-nums lining-nums; }
.ld .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; align-self: center; }
.ld .sign { width: 18px; color: var(--ink-soft); flex: none; text-align: center; }
.ld.total { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--ink); }
.ld.total > b { border-bottom: 4px double var(--ink); font-size: 1.12em; }
.ld .sub { color: var(--ink-soft); font-size: 13.5px; font-weight: 400; }

.bar { height: 9px; border-radius: 99px; background: var(--tint); overflow: hidden; box-shadow: inset 0 0 0 1px var(--hair); }
.bar > i { display: block; height: 100%; background: var(--olive); border-radius: 99px; transform-origin: left;}
.bar.done > i { background: var(--up); }

/* ============================================================
   我的规划
   ============================================================ */
.hero { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 24px; }
.hero-main {
  position: relative; padding: 32px 34px 26px; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r-card);
  box-shadow: inset 0 3px 0 var(--olive);
}
.hero-num { font: 400 clamp(60px, 7.4vw, 92px)/1 var(--font-display); letter-spacing: -.025em; margin: 10px 0 8px; font-variant-numeric: lining-nums; }
.hero-num .cur { font-size: .5em; vertical-align: .7em; margin-right: .08em; color: var(--ink-soft); }
.hero-num .dec { font-size: .4em; letter-spacing: 0; color: var(--ink-faint); }
.hero-sub { color: var(--ink-soft); max-width: 36em; }
.hero-sub b { color: var(--ink); font-weight: 600; }

.strata { margin-top: 24px; }
.strata-bar { display: flex; height: 46px; border-radius: 6px; overflow: hidden; border: 1px solid var(--olive-deep); }
.strata-bar .seg { position: relative; min-width: 10px; }
.seg.reserve { background: repeating-linear-gradient(135deg, var(--olive-deep) 0 7px, color-mix(in oklab, var(--olive-deep) 76%, var(--surface)) 7px 14px); }
.seg.alloc { background: var(--olive); }
.seg.free { background: var(--olive-wash); }
.strata-bar .seg span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font: 600 13.5px/1 var(--font-sans); color: var(--on-accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg.free span { color: var(--ink); }
.strata-legend { margin-top: 14px; }
.sw.reserve { background: repeating-linear-gradient(135deg, var(--olive-deep) 0 3px, color-mix(in oklab, var(--olive-deep) 70%, var(--surface)) 3px 6px); }
.sw.alloc { background: var(--olive); }
.sw.free { background: var(--olive-wash); box-shadow: inset 0 0 0 1px var(--olive); }

.nw { padding: 26px 28px; display: flex; flex-direction: column; }
.nw-num { font: 400 46px/1.05 var(--font-display); letter-spacing: -.015em; margin: 8px 0 14px; }
.nw-num small { font-size: .5em; color: var(--ink-faint); }
.nw details { margin-top: auto; }
.nw summary, .prov summary { cursor: pointer; font-weight: 600; color: var(--olive); list-style: none; display: flex; align-items: center; gap: 8px; min-height: 34px; }
.nw summary::-webkit-details-marker, .prov summary::-webkit-details-marker { display: none; }
.nw summary svg, .prov summary svg { transition: transform .2s; }
details[open] > summary svg { transform: rotate(90deg); }

.two { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.tape-bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; margin: 14px 0 6px; border: 1px solid var(--hair); }
.tape-bar span { display: block; height: 100%; }
.c-exp { background: color-mix(in oklab, var(--ink-soft) 38%, var(--surface)); }
.c-debt { background: color-mix(in oklab, var(--warn) 62%, var(--surface)); }
.c-goal { background: var(--olive); }
.c-left { background: var(--up); }

.act { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 20px; padding: 20px 22px; }
.act + .act { margin-top: 14px; }
.act h3 { font: 700 17px/1.3 var(--font-sans); }
.act .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.act .figs small { display: block; color: var(--ink-soft); font-size: 13px; }
.act .figs b { font: 400 25px/1.2 var(--font-display); font-variant-numeric: lining-nums; }
.act .bar { grid-column: 1 / -1; }
.act .side { display: grid; gap: 10px; justify-items: end; align-content: start; }
.act .recs { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-soft); border-top: 1px dashed var(--rule); padding-top: 10px; }
.act.pulse { animation: pulse 1.8s var(--ease) 1; }

.goal { padding: 26px 30px 24px; }
.goal + .goal { margin-top: 18px; }
.goal-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.goal-head h3 { font: 700 20px/1.3 var(--font-sans); }
.goal-head .due { color: var(--ink-soft); font-size: 14px; margin-left: auto; }
.track { position: relative; display: flex; height: 18px; margin: 38px 0 12px; border-radius: 4px; background: var(--tint); box-shadow: inset 0 0 0 1px var(--hair); }
.track > span { display: block; height: 100%; }
.track .a { background: var(--olive); border-radius: 4px 0 0 4px; }
.track .f { background: repeating-linear-gradient(135deg, var(--olive-soft) 0 5px, color-mix(in oklab, var(--olive-soft) 55%, var(--surface)) 5px 10px); }
.track .g { background: repeating-linear-gradient(135deg, var(--warn-tint) 0 4px, color-mix(in oklab, var(--warn) 30%, var(--warn-tint)) 4px 5px); box-shadow: inset 0 0 0 1.5px var(--warn); border-radius: 0 4px 4px 0; }
.track .flag { position: absolute; right: 0; top: -30px; height: 48px; border-right: 2px solid var(--ink); padding-right: 8px; font: 600 13px/1.6 var(--font-sans); color: var(--ink-soft); white-space: nowrap; }
.legend3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; }
.legend3 > div { display: grid; gap: 1px; }
.legend3 .k { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 13.5px; }
.legend3 .k i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.legend3 b { font: 400 26px/1.2 var(--font-display); font-variant-numeric: lining-nums; }
.legend3 small { color: var(--ink-soft); font-size: 13px; }
.k-a { background: var(--olive); } .k-f { background: repeating-linear-gradient(135deg, var(--olive-soft) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--olive-soft); } .k-g { background: var(--warn-tint); box-shadow: inset 0 0 0 1.5px var(--warn); }

.levers { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--rule); }
.levers > p { font-weight: 600; margin-bottom: 10px; }
.lever-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.lever { text-align: left; display: grid; gap: 3px; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--ground); transition: border-color .16s, background .16s, transform .16s; }
.lever:hover { border-color: var(--olive); background: var(--olive-tint); transform: translateY(-1px); }
.lever b { font: 700 17px/1.3 var(--font-sans); }
.lever small { color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; }
.lever .ok { color: var(--up); font-weight: 600; }
.lever .no { color: var(--down); font-weight: 600; }

.prov { padding: 8px 28px 20px; }
.prov .item { padding: 14px 0; border-bottom: 1px solid var(--hair); }
.prov .item:last-child { border-bottom: 0; }
.prov .eq { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; color: var(--ink-soft); font-size: 14px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.prov .eq b { color: var(--ink); font-weight: 600; }

/* ============================================================
   执行与复盘
   ============================================================ */
.ribbon { padding: 20px 26px 16px; }
.ribbon-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.ribbon-top b { font: 400 30px/1 var(--font-display); }
.ribbon-track { position: relative; margin: 38px 0 6px; height: 10px; border-radius: 99px; background: var(--tint); box-shadow: inset 0 0 0 1px var(--hair); }
.ribbon-track .past { position: absolute; left: 0; top: 0; bottom: 0; background: var(--olive); border-radius: 99px; }
.ribbon-track .zone { position: absolute; top: -4px; bottom: -4px; border-radius: 4px; background: color-mix(in oklab, var(--gold) 32%, transparent); box-shadow: inset 0 0 0 1px var(--gold); }
.ribbon-track .now { position: absolute; top: -9px; width: 2px; height: 28px; background: var(--ink); }
.ribbon-track .now::after { content: "今天"; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font: 700 12.5px/1 var(--font-sans); white-space: nowrap; }
.ribbon-scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); }

.renew { padding: 22px 26px; display: grid; gap: 12px; border-left: 4px solid var(--gold); }
.renew h3 { font: 700 18px/1.4 var(--font-sans); }

.ledger-wrap { overflow-x: auto; }
.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums lining-nums; min-width: 760px; }
.ledger th { text-align: left; font: 700 13px/1.4 var(--font-sans); letter-spacing: .06em; color: var(--ink-soft); padding: 12px 14px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.ledger td { padding: 15px 14px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.ledger tbody tr:nth-child(even) td { background: color-mix(in oklab, var(--tint) 55%, transparent); }
.ledger .r { text-align: right; }
.ledger .eff { display: grid; gap: 2px; justify-items: end; font-size: 14px; }
.ledger .eff .minus { color: var(--down); }
.ledger .eff .plus { color: var(--up); }
.ledger tr.void td { color: var(--ink-faint); }
.ledger tr.void .strike { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.filters { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.filters button { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--rule); background: transparent; font: 600 13.5px var(--font-sans); color: var(--ink-soft); }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }

.review { padding: 26px 30px; }
.review-banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 6px; background: var(--olive-tint); color: var(--ink); font-size: 14px; margin: 14px 0 20px; }
.review-banner svg { flex: none; margin-top: 3px; color: var(--olive); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tile { padding: 16px 18px; border: 1px dashed var(--rule); border-radius: var(--r-ctl); }
.tile small { color: var(--ink-soft); display: block; font-size: 13.5px; }
.tile b { display: block; font: 400 27px/1.25 var(--font-display); margin-top: 2px; font-variant-numeric: lining-nums; }
.tile b.none { color: var(--ink-faint); font-family: var(--font-sans); font-size: 17px; font-weight: 600; padding: 6px 0; }
.tile span { font-size: 13px; color: var(--ink-soft); }
.rv-goal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 14px 0; border-bottom: 1px solid var(--hair); }
.rv-goal:last-child { border-bottom: 0; }
.rv-goal .bar { grid-column: 1 / -1; }

/* ============================================================
   方案测算
   ============================================================ */
.scen { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 28px; align-items: start; }
.scen-controls { position: sticky; top: 16px; padding: 22px 24px; display: grid; gap: 16px; }
.scen-tabs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.scen-tabs button.tab { height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--rule); background: transparent; font: 700 14px var(--font-sans); color: var(--ink-soft); }
.scen-tabs button.tab[aria-selected="true"] { background: var(--olive); border-color: var(--olive-deep); color: var(--on-accent); }
.group-title { font: 700 13px/1 var(--font-sans); letter-spacing: .08em; color: var(--ink-faint); padding-top: 4px; border-top: 1px solid var(--hair); padding-top: 14px; }
.lock { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--warn); background: var(--warn-tint); border-radius: 6px; padding: 8px 10px; line-height: 1.55; }
.lock svg { flex: none; margin-top: 3px; }

.cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums lining-nums; }
.cmp th, .cmp td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--hair); vertical-align: top; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp thead th { font: 700 13.5px/1.4 var(--font-sans); border-bottom: 1.5px solid var(--ink); color: var(--ink-soft); vertical-align: bottom; }
.cmp thead th.base { color: var(--ink); }
.cmp tr.grp td { background: var(--tint); font: 700 14.5px var(--font-sans); border-bottom: 1px solid var(--rule); }
.cmp td.chg { background: color-mix(in oklab, var(--olive-wash) 80%, transparent); }
.delta { display: block; font-size: 13px; font-weight: 600; }
.delta.good { color: var(--up); } .delta.bad { color: var(--down); } .delta.same { color: var(--ink-faint); font-weight: 400; }

.draft { padding: 24px 28px; border-left: 4px solid var(--gold); margin-bottom: 20px; }
.draft.stale { border-left-color: var(--warn); background: var(--warn-tint); }
.draft h3 { font: 700 19px/1.4 var(--font-sans); }
.consent { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--ground); }
.consent input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--olive); flex: none; }
.vers { position: relative; padding-left: 22px; }
.vers::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; border-left: 1.5px solid var(--rule); }
.vers li { position: relative; padding: 8px 0 14px; }
.vers li::before { content: ""; position: absolute; left: -22px; top: 15px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--rule); }
.vers li.on::before { background: var(--olive); border-color: var(--olive); }

/* ============================================================
   财务建档
   ============================================================ */
.dirtybar {
  position: sticky; top: 0; z-index: 22; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin: 0 -12px; padding: 12px 18px; background: color-mix(in oklab, var(--surface) 96%, transparent); backdrop-filter: blur(8px);
  border: 1px solid var(--hair); border-left: 4px solid var(--hair); border-radius: 6px; box-shadow: 0 10px 24px -20px var(--shadow);
}
.dirtybar.dirty { border-left-color: var(--warn); background: color-mix(in oklab, var(--warn-tint) 96%, transparent); }
.dirtybar .t { flex: 1; min-width: 200px; }
.h-sec { margin-top: 40px; }
.h-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 22px; }
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.lab { font: 600 14px/1.4 var(--font-sans); }
.hint { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; }
.in {
  width: 100%; height: 44px; padding: 0 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-ctl);
  font: 500 15px/1 var(--font-sans); font-variant-numeric: tabular-nums lining-nums; transition: border-color .16s, box-shadow .16s;
}
textarea.in { height: auto; min-height: 84px; padding: 10px 12px; line-height: 1.6; resize: vertical; }
select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.in:hover { border-color: color-mix(in oklab, var(--olive) 55%, var(--rule)); }
.in:focus { border-color: var(--olive); outline: 3px solid color-mix(in oklab, var(--olive) 24%, transparent); outline-offset: 0; }
.in.err { border-color: var(--down); background: var(--down-tint); }
.in.changed { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn); }
.pre { position: relative; }
.pre > span { position: absolute; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; font-weight: 500; }
.pre.l > span { left: 12px; } .pre.l .in { padding-left: 28px; text-align: right; }
.pre.r > span { right: 12px; } .pre.r .in { padding-right: 36px; text-align: right; }
.errmsg { color: var(--down); font-size: 13.5px; line-height: 1.5; display: flex; gap: 6px; align-items: flex-start; }
.errmsg svg { flex: none; margin-top: 3px; }
.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface); overflow: hidden; height: 44px; }
.stepper button { width: 42px; border: 0; background: transparent; font-size: 20px; color: var(--ink-soft); }
.stepper button:hover { background: var(--olive-tint); }
.stepper output { min-width: 56px; display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; border-inline: 1px solid var(--hair); }

.acct { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, .9fr) minmax(0, .9fr) minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, .8fr); gap: 12px; align-items: end; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.acct:first-of-type { border-top: 1.5px solid var(--ink); }
.acct .more { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-soft); display: flex; gap: 16px; flex-wrap: wrap; }
.goal-row { display: grid; grid-template-columns: 56px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: end; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.goal-row .rank { display: grid; justify-items: center; gap: 2px; align-self: center; }
.goal-row .rank b { font: 400 30px/1 var(--font-display); color: var(--olive); }
.goal-row .rank button { width: 34px; height: 24px; border: 1px solid var(--rule); border-radius: 5px; background: var(--surface); color: var(--ink-soft); display: grid; place-items: center; padding: 0; }
.goal-row .rank button:hover:not(:disabled) { border-color: var(--olive); color: var(--olive); }
.goal-row .rank button:disabled { opacity: .35; cursor: not-allowed; }

.matrix { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums lining-nums; }
.matrix th, .matrix td { padding: 10px 10px; border-bottom: 1px solid var(--hair); text-align: right; }
.matrix th:first-child, .matrix td:first-child { text-align: left; }
.matrix thead th { border-bottom: 1.5px solid var(--ink); font: 700 13.5px var(--font-sans); color: var(--ink-soft); }
.matrix td .in { height: 38px; text-align: right; }
.matrix tfoot td { font-weight: 700; border-top: 1.5px solid var(--ink); border-bottom: 0; }
.matrix .left { color: var(--up); }
.matrix .over { color: var(--down); }

/* ============================================================
   浮层：抽屉、对话框、提示条、评审视图
   ============================================================ */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(580px, 100vw); display: flex; flex-direction: column;
  background: var(--ground); border-left: 1px solid var(--rule); box-shadow: -30px 0 70px -34px var(--shadow);
}
.sheet[data-fresh] { animation: slide-in .3s var(--ease) both; }
.sheet-head { padding: 24px 28px 16px; border-bottom: 1px solid var(--hair); display: flex; gap: 14px; align-items: flex-start; }
.sheet-head h2 { font: 400 32px/1.15 var(--font-display); }
.sheet-body { padding: 22px 28px; overflow: auto; flex: 1; display: grid; gap: 20px; align-content: start; }
.sheet-foot { padding: 14px 28px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); background: var(--surface); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sheet-foot .grow { flex: 1; font-size: 13.5px; color: var(--ink-soft); }
.chips-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.draft-chip { display: inline-flex; align-items: center; height: 36px; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface); overflow: hidden; }
.draft-chip button { height: 100%; border: 0; background: transparent; padding: 0 14px; font: 600 14px var(--font-sans); }
.draft-chip button.x { padding: 0 10px 0 4px; color: var(--ink-faint); }
.draft-chip[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.draft-chip[aria-current="true"] button.x { color: var(--ground); opacity: .7; }
.draft-chip.bad { border-color: var(--down); }
.draft-chip .bd { width: 8px; height: 8px; border-radius: 50%; background: var(--down); margin-left: 12px; }
.date-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.date-chips button { height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface); font: 600 14px var(--font-sans); }
.date-chips button[aria-pressed="true"] { background: var(--olive); border-color: var(--olive-deep); color: var(--on-accent); }
.date-chips button:disabled { opacity: .45; text-decoration: line-through; cursor: not-allowed; }
.preview { padding: 16px 18px; border-radius: var(--r-ctl); background: var(--surface); border: 1px solid var(--hair); border-left: 3px solid var(--olive); }
.preview.forecast { border-left-style: dashed; border-left-color: var(--ink-faint); background: transparent; }
.preview h4 { font: 700 13px/1 var(--font-sans); letter-spacing: .08em; color: var(--ink-soft); margin-bottom: 8px; }
.pv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px 14px; align-items: baseline; padding: 5px 0; font-variant-numeric: tabular-nums lining-nums; }
.pv-row .arrow { color: var(--ink-faint); }
.pv-row .d.minus { color: var(--down); font-weight: 600; } .pv-row .d.plus { color: var(--up); font-weight: 600; }
.sheet details.more > summary { cursor: pointer; font-weight: 600; color: var(--olive); min-height: 34px; display: flex; align-items: center; gap: 8px; list-style: none; }
.sheet details.more > summary::-webkit-details-marker { display: none; }
.autosave { font-size: 13px; color: var(--ink-soft); display: inline-flex; gap: 6px; align-items: center; }
.autosave i { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.summary-err { padding: 12px 14px; border-radius: 6px; background: var(--down-tint); color: var(--down); font-weight: 600; display: flex; gap: 10px; align-items: flex-start; }

.dialog {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 51; width: min(540px, calc(100vw - 28px));
  background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 26px 28px 22px; box-shadow: 0 40px 90px -40px var(--shadow);
  display: grid; gap: 14px;
}
.dialog[data-fresh] { animation: pop .26s var(--ease) both; }
.dialog h2 { font: 400 29px/1.2 var(--font-display); }
.dialog .impact { padding: 12px 14px; background: var(--tint); border-radius: 6px; font-size: 14px; display: grid; gap: 4px; }
.dialog .foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }

.toasts { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 70; display: grid; gap: 8px; width: min(580px, calc(100vw - 28px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 10px; background: var(--ink); color: var(--ground); box-shadow: 0 20px 50px -20px var(--shadow); animation: rise .38s var(--ease) both; }
.toast p { flex: 1; font-size: 14.5px; line-height: 1.55; }
.toast button { background: none; border: 0; color: var(--gold); font-weight: 700; padding: 4px 6px; }
:root[data-theme="dark"] .toast button { color: var(--olive-deep); }

.pop { position: fixed; z-index: 55; left: 20px; bottom: 74px; width: 330px; padding: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 30px 70px -30px var(--shadow); display: grid; gap: 12px; }
.pop h3 { font: 700 14px/1 var(--font-sans); letter-spacing: .06em; color: var(--ink-soft); }
.radio { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 8px 8px; border-radius: 6px; cursor: pointer; line-height: 1.5; font-size: 14px; }
.radio:hover { background: var(--olive-tint); }
.radio input { margin-top: 4px; accent-color: var(--olive); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; padding: 4px 8px; }
.switch-row input { width: 20px; height: 20px; accent-color: var(--olive); }

.legend-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.legend-table td, .legend-table th { padding: 10px 10px; border-bottom: 1px solid var(--hair); text-align: left; vertical-align: top; }
.legend-table th { font: 700 13px var(--font-sans); color: var(--ink-soft); letter-spacing: .05em; position: sticky; top: 0; background: var(--ground); }
.legend-table .id { font: 700 13px var(--font-sans); white-space: nowrap; }
.legend-table .be { white-space: nowrap; }

/* 评审标注：只在打开「显示评审标注」后出现 */
.notes [data-fix] { position: relative; outline: 1.5px dashed color-mix(in oklab, var(--gold) 92%, transparent); outline-offset: 5px; border-radius: 4px; }
.notes [data-fix]::after {
  content: attr(data-fix); position: absolute; top: -11px; right: 10px; z-index: 6; pointer-events: none;
  background: var(--gold); color: #2b2418; font: 700 11.5px/1 var(--font-sans); padding: 4px 7px; border-radius: 99px; letter-spacing: .02em;
}

/* ============================================================
   助手抽屉
   ============================================================ */
.assist-state { display: grid; gap: 10px; padding: 16px; border: 1px dashed var(--rule); border-radius: var(--r-ctl); }
.assist-state ol { padding-left: 20px; list-style: decimal; display: grid; gap: 6px; font-size: 14px; }
code, .code { font-family: Consolas, "Cascadia Mono", monospace; font-size: .92em; background: var(--tint); padding: 1px 6px; border-radius: 4px; }

/* ============================================================
   空状态
   ============================================================ */
.empty { padding: 44px 36px; text-align: left; display: grid; gap: 14px; justify-items: start; background-image: radial-gradient(480px 220px at 0% 0%, var(--olive-wash), transparent 70%); }
.empty h2 { font: 400 36px/1.2 var(--font-display); }
.empty ol { display: grid; gap: 8px; margin-top: 4px; }
.empty ol li { display: flex; gap: 12px; align-items: baseline; }
.empty ol li b { font: 400 26px/1 var(--font-display); color: var(--olive); width: 26px; }

/* ============================================================
   底部标签栏与悬浮按钮（窄屏）
   ============================================================ */
.tabbar, .fab { display: none; }

/* 动效：进入页面时分层浮现；进度条自左向右生长 */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slide-in { from { transform: translateX(36px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--olive) 50%, transparent); } 60% { box-shadow: 0 0 0 12px transparent; } }
/* 进入动画只在换页时（#app.play）播放一次；局部刷新、输入时不重播 */
.play .rv { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
.play .bar > i { animation: grow .9s var(--ease) both; animation-delay: calc(.25s + var(--i, 0) * 70ms); }
.play .strata-bar .seg, .play .tape-bar span, .play .track > span, .play .ribbon-track .past { animation: wipe .9s var(--ease) both; animation-delay: .2s; }

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 1260px) {
  .main { padding: 0 32px 140px; }
  .hero, .two { grid-template-columns: minmax(0, 1fr); }
  .scen { grid-template-columns: minmax(0, 1fr); }
  .scen-controls { position: static; }
}
@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .main { padding: 0 18px 150px; }
  .page-head { grid-template-columns: minmax(0, 1fr); }
  .page-head .meta { text-align: left; justify-items: start; }
  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    background: color-mix(in oklab, var(--surface) 94%, transparent); backdrop-filter: blur(12px);
    border-top: 1px solid var(--rule); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar a { display: grid; justify-items: center; gap: 3px; padding: 6px 0; min-height: 54px; font-size: 13px; text-decoration: none; color: var(--ink-soft); border-radius: 8px; }
  .tabbar a[aria-current="page"] { color: var(--olive); font-weight: 700; background: var(--olive-tint); }
  .fab {
    display: inline-flex; position: fixed; right: 16px; bottom: 88px; z-index: 36; height: 54px; padding: 0 20px; border-radius: 99px;
    background: var(--olive); color: var(--on-accent); border: 1px solid var(--olive-deep); font: 700 15px var(--font-sans); align-items: center; gap: 8px;
    box-shadow: 0 16px 34px -14px var(--shadow);
  }
  .pop { left: 12px; right: 12px; width: auto; bottom: 150px; }
  .toasts { bottom: 150px; }
  .sheet { width: 100vw; top: auto; height: 94vh; border-left: 0; border-top: 1px solid var(--rule); border-radius: 16px 16px 0 0; }
  .sheet[data-fresh] { animation-name: sheet-up; }
  .next { flex-wrap: wrap; }
  .next .acts { justify-content: flex-start; }
  .h-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .acct { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .goal-row { grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1fr); }
  .goal-row .field:nth-of-type(1) { grid-column: 2 / -1; }
}
@media (max-width: 680px) {
  .title { font-size: 34px; }
  .hero-main { padding: 22px 20px; }
  .nw { padding: 22px 20px; }
  .pad, .goal, .review { padding: 20px 18px; }
  .grid2, .tiles, .lever-grid, .legend3, .act .figs { grid-template-columns: minmax(0, 1fr); }
  .act .figs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .act { grid-template-columns: minmax(0, 1fr); }
  .act .side { justify-items: stretch; }
  .h-grid { grid-template-columns: minmax(0, 1fr); }

<body>
<button class="btn skip" type="button" data-act="skip">跳到主内容</button>
<div id="app" class="play"></div>
<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px;font:16px/1.7 sans-serif">这个原型需要启用 JavaScript。</p></noscript>
<script>
/* ============================================================
   测算引擎（示意版）
   忠实移植 backend/app/planner/engine.py 的口径，金额一律用「分」整数；
   只有收益/通胀的复利才用浮点（原型示意，生产必须使用后端 Decimal 计算）。
   ============================================================ */

/* 把用户输入「1,234.5」解析成分；无法解析返回 null */
function parseCents(text) {
  if (text == null) return null;
  const t = String(text).replace(/[,，\s¥￥]/g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
  const [w, f = ''] = t.split('.');
  return Number(w) * 100 + Number((f + '00').slice(0, 2));
}

/* 分 → 展示串。dec=false 时省略小数；sign=true 时正数带 + 号 */
const nf0 = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 });
function fmtYuan(c, { dec = true, sign = false } = {}) {
  if (c == null) return '待补充';
  const neg = c < 0;
  const abs = Math.abs(c);
  const whole = nf0.format(Math.floor(abs / 100));
  const frac = String(abs % 100).padStart(2, '0');
  const body = dec ? `${whole}.${frac}` : (abs % 100 ? `${whole}.${frac}` : whole);
  return `${neg ? '−' : sign && c > 0 ? '＋' : ''}¥${body}`;
}

/* 日期平移 n 天（ISO 串，按 UTC 计算，避免本地时区干扰） */
function shiftDay(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return t.toISOString().slice(0, 10);
}

function monthAfter(iso, count) {
  const [y, m, d] = iso.split('-').map(Number);
  const n = y * 12 + (m - 1) + count;
  const yy = Math.floor(n / 12);
  const mm = (n % 12) + 1;
  const last = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  return `${yy}-${String(mm).padStart(2, '0')}-${String(Math.min(d, last)).padStart(2, '0')}`;
}

function monthsBetween(asOf, due) {
  if (due <= asOf) return 0;
  const [ay, am] = asOf.split('-').map(Number);
  const [dy, dm] = due.split('-').map(Number);
  let months = (dy - ay) * 12 + dm - am;
  if (monthAfter(asOf, months) > due) months -= 1;
  return Math.max(months, 0);
}

/* 一个目标在给定条件下的结果（与 engine.py 的 goals[] 同口径） */
function goalResult(g, funded, affordable, wanted, scen, asOf) {
  const due = monthAfter(g.due, scen.extend || 0);
  const months = monthsBetween(asOf, due);
  const reduce = scen.reducePct || 0;                       // 百分数 0–100
  const infl = (scen.infl || 0) / 100;                      // 界面用百分数，引擎用小数
  const ret = (scen.ret || 0) / 100;
  const target = Math.round(g.target * (1 - reduce / 100) * Math.pow(1 + infl / 12, months));
  const rate = ret / 12;
  const growth = Math.pow(1 + rate, months);
  const annuity = rate === 0 ? months : (growth - 1) / rate;
  const projected = Math.round(funded * growth + affordable * annuity);
  const needed = annuity ? Math.max(Math.ceil((target - funded * growth) / annuity - 1e-9), 0) : null;   // 向上取整到分：填回去才真的补得上（N9）
  return {
    id: g.id, name: g.name, due, months, target, funded, wanted, affordable,
    needed, projected, shortfall: Math.max(target - projected, 0),
    annuity, growth,
  };
}

/* 主测算。h=建档，events=流水，scen=试算条件，today=测算日 */
function calc(h, events, scen = {}, today) {
  const S = { extraIncome: 0, extraExpenses: 0, reducePct: 0, ret: 0, infl: 0, extend: 0, monthly: {}, ...scen };
  const assets = Object.fromEntries(h.assets.map(a => [a.id, a]));
  const bal = Object.fromEntries(h.assets.map(a => [a.id, a.quality === 'unknown' ? null : a.amount]));
  const debts = Object.fromEntries(h.debts.map(d => [d.id, d.balance]));
  const allocations = h.allocations.map(a => ({ ...a }));
  const used = [];                                          // 已计入余额的流水（供「数字从哪来」使用）

  const live = events
    .filter(e => !e.voided && e.state === 'confirmed' && e.date <= today)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  for (const e of live) {
    const a = assets[e.asset_id];
    if (!a) continue;
    if (e.date > a.observed_on && bal[a.id] != null) {
      bal[a.id] += e.kind === 'income' ? e.amount : -e.amount;
      used.push({ id: e.id, asset_id: a.id, delta: e.kind === 'income' ? e.amount : -e.amount, date: e.date });
    }
    if (e.kind === 'transfer') {
      const t = assets[e.target_asset_id];
      if (!t) continue;
      const arrive = e.target_amount ?? e.amount;
      if (e.date > t.observed_on && bal[t.id] != null) {
        bal[t.id] += arrive;
        used.push({ id: e.id, asset_id: t.id, delta: arrive, date: e.date });
      }
      if (e.goal_id && e.date > h.as_of && e.mode !== 'move_existing') {
        allocations.push({ asset_id: t.id, goal_id: e.goal_id, amount: arrive });
      }
    }
    if (e.kind === 'debt_payment' && e.date > h.as_of && debts[e.debt_id] != null) {
      debts[e.debt_id] -= e.principal || 0;
    }
  }

  const warnings = [];
  const missing = [];
  const incomplete = h.income == null || h.expenses == null || h.essential == null;
  if (h.income == null) missing.push('月收入未填');
  if (h.expenses == null) missing.push('月支出未填');
  if (h.essential == null) missing.push('必要支出未填，无法计算应急预留');
  let total = 0, cash = 0, liquid = 0, debtTotal = 0, known = true;
  const rows = h.assets.map(a => {
    const v = bal[a.id];
    if (v == null) { known = false; missing.push(`${a.name}的金额未知`); }
    else {
      total += v;
      if (a.liq === 'available' && (a.kind === 'cash' || a.kind === 'investment')) liquid += v;
      if (a.kind === 'cash' && a.liq === 'available') cash += v;
    }
    if (a.quality === 'estimated') warnings.push(`${a.name}使用估算金额`);
    const moves = used.filter(u => u.asset_id === a.id);
    return { ...a, balance: v, anchor: a.amount, moves, moved: moves.reduce((s, m) => s + m.delta, 0) };
  });
  let minimum = 0;
  for (const d of h.debts) {
    debtTotal += debts[d.id] || 0;
    if (!d.in_expenses) minimum += d.minimum || 0;
  }

  const reserve = h.essential == null ? null : h.essential * h.reserve_months;
  const available = reserve == null ? null : Math.max(cash - reserve, 0);
  const funded = Object.fromEntries(h.goals.map(g => [g.id, 0]));
  let cashAllocated = 0;
  for (const a of allocations) {
    const asset = assets[a.asset_id];
    if (!asset || funded[a.goal_id] == null) continue;
    funded[a.goal_id] += a.amount;
    if (asset.kind === 'cash') cashAllocated += a.amount;
  }
  const errors = [];
  if (available != null && cashAllocated > available) errors.push('目标现金分配占用了应急预留');

  const linked = {};
  let unlinked = 0;
  for (const c of h.commitments) {
    if (c.goal_id) linked[c.goal_id] = (linked[c.goal_id] || 0) + c.monthly;
    else unlinked += c.monthly;
  }
  const surplus = incomplete ? 0 : h.income + S.extraIncome - h.expenses - S.extraExpenses - minimum;
  const pool = Math.max(surplus - unlinked, 0);
  let remaining = pool;
  const goals = [];
  h.goals.forEach((g, idx) => {                             // 顺序即优先级
    const asked = S.monthly[g.id] != null ? S.monthly[g.id] : g.monthly;
    const floor = linked[g.id] || 0;
    const wanted = Math.max(asked, floor);
    const affordable = Math.min(wanted, remaining);
    remaining -= affordable;
    const r = goalResult(g, funded[g.id], affordable, wanted, S, today);
    goals.push({ ...r, priority: idx + 1, asked, floor, floorBinds: floor > asked });
  });
  const committed = goals.reduce((s, g) => s + g.wanted, 0) + unlinked;
  if (goals.reduce((s, g) => s + g.wanted, 0) > pool) errors.push('月度投入超过可分配结余');

  return {
    today, base: h.base_currency,
    netWorth: known ? total - debtTotal : null, assetsTotal: total, debtTotal,
    cash, liquid, reserve, reserveShortfall: reserve == null ? null : Math.max(reserve - cash, 0),
    available, cashAllocated,
    free: available == null ? null : Math.max(available - cashAllocated, 0),
    incomplete, income: incomplete ? null : h.income + S.extraIncome, expenses: incomplete ? null : h.expenses + S.extraExpenses,
    minimum, surplus, unlinked, pool, committed, remaining,
    goals, rows, warnings: [...new Set(warnings)], missing, errors,
    executable: !missing.length && !errors.length,
  };
}

/* 缺口怎么补：给出三个互相独立的杠杆（与后端 needed_monthly 同口径，生产应由后端返回） */
function levers(g, res, h, scen, today) {
  if (!g.shortfall) return null;
  const base = { ...scen, monthly: { ...(scen.monthly || {}) } };
  // ① 每月多投
  const need = g.needed;
  const extra = need != null ? Math.max(need - g.affordable, 0) : null;
  const monthly = extra == null ? null : {
    extra, newMonthly: g.affordable + extra,
    fits: extra <= res.remaining,
    patch: { monthly: { [g.id]: g.affordable + extra } },
  };
  // ② 延期：逐月试到缺口为 0
  let ext = null;
  for (let k = 1; k <= 120; k++) {
    const r = goalResult({ ...h.goals.find(x => x.id === g.id) }, g.funded, g.affordable, g.wanted, { ...base, extend: (base.extend || 0) + k }, today);
    if (r.shortfall === 0) { ext = { months: k, due: r.due, patch: { extend: (base.extend || 0) + k } }; break; }
  }
  // ③ 下调目标：整数运算向上取整到 0.1%
  const pm = Math.ceil((g.shortfall * 1000) / g.target);
  const reduce = pm <= 1000 ? { pct: pm / 10, newTarget: g.target - g.shortfall, patch: { reducePct: (base.reducePct || 0) + pm / 10 } } : null;
  return { monthly, ext, reduce };
}

/* 本月行动：与 service.action_view 同口径，但「进度」只看本月已发生的新增投入，
   不再因为重设基准日期而清零（对应 P3） */
function actionsFor(plan, events, month, today) {
  if (!plan || plan.status !== 'active') return [];
  return plan.actions.filter(a => a.month === month).map(a => {
    const recs = events.filter(e => !e.voided && e.state === 'confirmed' && e.kind === 'transfer'
      && e.mode !== 'move_existing' && e.goal_id === a.goal_id && e.date.startsWith(month) && e.date <= today);
    const actual = recs.reduce((s, e) => s + (e.target_amount ?? e.amount), 0);
    const status = actual >= a.amount ? 'completed' : actual > 0 ? 'in_progress' : 'pending';
    return { ...a, actual, remaining: Math.max(a.amount - actual, 0), excess: Math.max(actual - a.amount, 0), status, records: recs };
  });
}

if (typeof module !== 'undefined') module.exports = { parseCents, fmtYuan, shiftDay, monthAfter, monthsBetween, calc, levers, actionsFor, goalResult };

/* ============================================================
   示例数据：与 8011 上虚构家庭一致（金额单位：分）
   目标的数组顺序即优先级（第 1 位最高）——对应 I10 的排序式优先级。
   ============================================================ */
function baseHousehold() {
  return {
    name: '我的家庭财务', as_of: '2026-10-17', base_currency: 'CNY',
    income: 1600000, expenses: 700000, essential: 500000, reserve_months: 6,
    risk: '谨慎', source: '虚构示例 / 手动录入',
    assets: [
      { id: 'cash', name: '日常与储蓄账户', kind: 'cash', liq: 'available', cur: 'CNY', amount: 10000000, observed_on: '2026-10-17', quality: 'verified', source: '虚构示例' },
      { id: 'investment', name: '目标投资账户', kind: 'investment', liq: 'available', cur: 'CNY', amount: 2000000, observed_on: '2026-10-17', quality: 'estimated', source: '虚构示例 / 人工估值' },
      { id: 'home', name: '自住房', kind: 'property', liq: 'illiquid', cur: 'CNY', amount: 120000000, observed_on: '2026-10-17', quality: 'estimated', source: '虚构示例 / 人工估值' },
    ],
    debts: [{ id: 'mortgage', name: '住房贷款', balance: 50000000, minimum: 300000, in_expenses: false }],
    goals: [
      { id: 'study', name: '学习进修', target: 5000000, due: '2027-10-31', monthly: 200000 },
      { id: 'family', name: '家庭长期储蓄', target: 20000000, due: '2031-10-31', monthly: 300000 },
    ],
    allocations: [
      { asset_id: 'cash', goal_id: 'study', amount: 2000000 },
      { asset_id: 'investment', goal_id: 'family', amount: 2000000 },
    ],
    commitments: [{ id: 'pac', name: '长期储蓄定投', monthly: 300000, goal_id: 'family' }],
  };
}

function emptyHousehold(today) {
  return {
    name: '我的家庭财务', as_of: shiftDay(today, -1),
    base_currency: 'CNY', income: null, expenses: null, essential: null, reserve_months: 6,
    risk: '尚未明确', source: '手动录入',
    assets: [], debts: [], goals: [], allocations: [], commitments: [],
  };
}

const EV_STUDY = {
  id: 'e1', kind: 'transfer', mode: 'new_funding', state: 'confirmed', quality: 'verified',
  date: '2026-10-19', asset_id: 'cash', target_asset_id: 'investment', amount: 200000, target_amount: null,
  goal_id: 'study', source: '手动录入', note: '', voided: false,
};
const EV_FAMILY = {
  id: 'e2', kind: 'transfer', mode: 'new_funding', state: 'confirmed', quality: 'verified',
  date: '2026-10-28', asset_id: 'cash', target_asset_id: 'investment', amount: 300000, target_amount: null,
  goal_id: 'family', source: '手动录入', note: '', voided: false,
};

/* 方案 v1：确认时冻结的每月计划（与后端 confirm 生成的 action 同口径） */
function planV1() {
  return {
    id: 'v1', version: 1, status: 'active', rev: 1, confirmed_at: '2026-10-19 18:51', as_of: '2026-10-17',
    summary: '学习 ¥2,000 / 家庭 ¥3,000 · 缺口 ¥6,000（已确认知晓）',
    actions: [
      { id: 'act-study', goal_id: 'study', month: '2026-10', amount: 200000 },
      { id: 'act-family', goal_id: 'family', month: '2026-10', amount: 300000 },
    ],
  };
}

/* 评审视图（演示状态）：每个状态只改动变量，页面逻辑一致 */
const DEMOS = {
  oct19: { label: '10 月 19 日 · 方案使用中，投入进行中', today: '2026-10-19' },
  empty: { label: '新用户 · 还没有建档（空状态）', today: '2026-10-19' },
  stale: { label: '方案草案已过期（草案后又记了一笔账）', today: '2026-10-19' },
  nov02: { label: '11 月 2 日 · 跨月（方案仍使用中，本月无行动）', today: '2026-11-02' },
  oct31: { label: '10 月 31 日 · 月末（可以生成复盘）', today: '2026-10-31' },
};

function loadDemo(name) {
  const d = DEMOS[name];
  const today = d.today;
  const S = {
    demo: name, today, rev: 2, household: baseHousehold(), ledger: [{ ...EV_STUDY }],
    plans: [planV1()], pending: null, reviewedAt: '2026-10-19',
    reviews: [],
  };
  if (name === 'empty') {
    S.rev = 0; S.household = emptyHousehold(today); S.ledger = []; S.plans = []; S.reviewedAt = null;
  }
  if (name === 'stale') {
    S.pending = { id: 'draft2', rev: 1, scen: { monthly: { study: 233334 } }, created_at: '2026-10-19 19:05' };
  }
  if (name === 'nov02') {
    S.rev = 2; S.reviewedAt = '2026-10-19';
  }
  if (name === 'oct31') {
    S.ledger.push({ ...EV_FAMILY });
    S.rev = 3; S.reviewedAt = null;
  }
  return S;

function persist() {

  } catch (e) { /* 隐私模式下忽略 */ }
}
function restore() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!v) return;
    UI.theme = v.theme || 'light'; UI.notes = !!v.notes;
    if (v.demo && DEMOS[v.demo] && v.demo !== S.demo) resetDemo(v.demo);
    const d = v.drafts && v.drafts[S.demo];
    if (Array.isArray(d) && d.length) { UI.drafts = d; UI.cur = Math.min(v.cur || 0, d.length - 1); }

}

/* ---------- 派生数据 ---------- */
const plan = () => S.plans.find((p) => p.status === 'active') || null;
const planParams = () => (plan() && plan().params) || {};
const RES = (params) => calc(S.household, S.ledger, params ?? planParams(), S.today);
const month = () => S.today.slice(0, 7);
const ACTS = () => actionsFor(plan(), S.ledger, month(), S.today).sort((a, b) => ({ in_progress: 0, pending: 1, completed: 2 }[a.status] - { in_progress: 0, pending: 1, completed: 2 }[b.status]));
const asset = (id) => S.household.assets.find((a) => a.id === id);
const goal = (id) => S.household.goals.find((g) => g.id === id);
function monthInfo() {
  const m = month();
  const n = daysIn(m);
  const d = Number(S.today.slice(8));
  return { m, label: monthLabel(m), day: d, n, left: n - d, zoneStart: n - 3 };
}
function diffCount(a, b) {
  if (a === b) return 0;
  if (a == null || b == null || typeof a !== 'object' || typeof b !== 'object') return 1;
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  let n = 0;
  keys.forEach((k) => { n += diffCount(a[k], b[k]); });
  return n;
}
const hhChanges = () => diffCount(UI.hh, S.household);
const isDirty = () => hhChanges() > 0;
const newRecords = () => S.ledger.filter((e) => !e.voided).length;

/* ---------- 「下一步」条：每页顶部只给一件事 ---------- */
function nextStep() {
  const info = monthInfo();
  const p = plan();
  const acts = ACTS();
  if (S.rev === 0) {
    return { cls: '', fix: '', text: '还没有建档。先花几分钟说清账户、收支和目标。', small: '想先看看效果？示例是一户虚构家庭，不会混进你的真实记录。', acts: [btn('开始建档', { cls: 'primary', href: '#/household' }), btn('用示例体验', { act: 'hh-example' })] };
  }
  const R0 = RES();
  if (R0.incomplete) {
    return { cls: 'warn', fix: '', text: `建档还差一点：${R0.missing.join('；')}。`, small: '资料不完整时不会替你当作 0 来算——补上之后才能试算。', acts: [btn('去补全建档', { cls: 'primary', href: '#/household' })] };
  }
  if (!p && !S.pending) {
    return { cls: '', fix: '', text: '建档已保存。下一步：试算一下，看目标够不够。', small: '试算不会改动你的账目；满意了再生成方案草案、确认。', acts: [btn('去试算', { cls: 'primary', href: '#/scenarios' })] };
  }
  if (S.pending) {
    if (S.pending.rev !== S.rev) {
      return { cls: 'warn', fix: 'P5', text: '方案草案已过期：生成草案之后，账目又有了新记录。', small: '过期的草案不能确认。基于最新账目重新测算一次就好，试算条件会保留。', acts: [btn('基于最新账目重新测算', { cls: 'primary', act: 'plan-retest' }), btn('查看草案', { href: '#/scenarios' })] };
    }
    return { cls: '', fix: '', text: '有一份方案草案等你确认。', small: '确认前先看它和当前方案的差别。', acts: [btn('查看并确认', { cls: 'primary', href: '#/scenarios' })] };
  }
  if (p && !acts.length) {
    return { cls: 'warn', fix: 'P1', text: `进入 ${info.label}：方案 v${p.version} 仍在使用，但这个月还没有投入计划。`, small: '沿用方案需要你确认一次，不会自动改动任何金额。', acts: [btn('沿用方案，生成本月计划', { cls: 'primary', href: '#/execution' }), btn('先去试算调整', { href: '#/scenarios' })] };
  }
  const open = acts.filter((a) => a.status !== 'completed');
  if (open.length) {
    const a = open[0];
    const g = goal(a.goal_id);
    return { cls: '', fix: 'I3', text: `本月还差 <b class="num">${Y(open.reduce((s, x) => s + x.remaining, 0))}</b> 没有投入${open.length > 1 ? '' : `「${esc(g.name)}」`}。`, small: '投入后在这里记一笔，进度会自动累计；FinUnity 不会替你认定“已经交易”。', acts: [btn('记录本次投入', { cls: 'primary', act: 'open-record', data: `data-kind="contribution" data-action="${a.id}"` })] };
  }
  if (info.day >= info.zoneStart && !S.reviewRev) {
    return { cls: '', fix: 'P1', text: `${info.label}快结束了：生成本月复盘，对照计划与实际。`, small: '复盘只汇总你确认过的记录，不改动建档和流水。', acts: [btn('生成本月复盘', { cls: 'primary', act: 'review-make', data: `data-m="${info.m}"` })] };
  }
  return { cls: 'ok', fix: '', text: '本月的计划投入都已完成。', small: `月底前（${info.zoneStart}–${info.n} 日）生成复盘即可。`, acts: [btn('去看复盘', { href: '#/execution' })] };
}
