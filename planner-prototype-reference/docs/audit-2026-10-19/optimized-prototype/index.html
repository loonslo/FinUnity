function goalCard(g, R, i) {
  const a = Math.min(g.funded, g.target);
  const future = Math.max(Math.min(g.projected - g.funded, g.target - a), 0);
  const gap = g.shortfall;
  const pct = (x) => `${((x / Math.max(g.target, 1)) * 100).toFixed(2)}%`;
  const lv = levers(g, R, S.household, planParams(), S.today);
  const over = Math.max(g.projected - g.target, 0);
  const extra = (planParams().ret || 0) ? '（含收益假设）' : '';
  return `<article class="card goal rv" style="--i:${4 + i}" aria-label="${esc(g.name)}">
    <div class="goal-head">
      <h3>${esc(g.name)}</h3>${chip(`第 ${g.priority} 优先`, 'plain')}
      ${gap ? chip(`缺口 ${Y(gap)}`, 'warn') : chip(`${ic('check', 14, 2)}按计划可达成`, 'up')}
      <span class="due">${g.due} 到期 · 还有 ${g.months} 个月</span>
    </div>
    <div class="track" role="img" aria-label="已分配 ${Y(g.funded)}，未来投入 ${Y(future)}，缺口 ${Y(gap)}，目标 ${Y(g.target)}">
      <span class="a" style="width:${pct(a)}"></span><span class="f" style="width:${pct(future)}"></span>${gap ? `<span class="g" style="width:${pct(gap)}"></span>` : ''}
      <span class="flag">目标 ${Y(g.target, { dec: false })}</span>
    </div>
    <div class="legend3">
      <div><span class="k"><i class="k-a"></i>已分配</span><b>${Y(g.funded)}</b><small>已经分给这个目标的钱</small></div>
      <div><span class="k"><i class="k-f"></i>未来投入</span><b>${Y(Math.max(g.projected - g.funded, 0))}</b><small>每月 ${Y(g.affordable)} × ${g.months} 个月${extra}${g.floorBinds ? ' · 含定投下限' : ''}</small></div>
      <div><span class="k"><i class="k-g"></i>${gap || !over ? '预计缺口' : '预计超出'}</span><b>${gap ? Y(gap) : over ? Y(over) : '无缺口'}</b><small>${gap ? `每月需要 ${Y(g.needed)} 才补得上` : over ? '到期时超出目标' : '到期时刚好达成目标'}</small></div>
    </div>
    ${lv ? `<div class="levers" ${fix('N8')}>
      <p>怎么补上 ${Y(gap)}？选一条，带到试算里看看：</p>
      <div class="lever-grid">
        ${lv.monthly ? `<button type="button" class="lever" data-act="lever" data-goal="${g.id}" data-kind="monthly"><b>每月多投 ${Y(lv.monthly.extra)}</b><small>每月 ${Y(g.affordable)} → ${Y(lv.monthly.newMonthly)}。${lv.monthly.fits ? `<span class="ok">在月度剩余额度 ${Y(R.remaining)} 之内</span>` : `<span class="no">超出月度剩余额度 ${Y(R.remaining)}，需同时增加收入或下调其它目标</span>`}</small></button>` : ''}
        ${lv.ext ? `<button type="button" class="lever" data-act="lever" data-goal="${g.id}" data-kind="ext"><b>延期 ${lv.ext.months} 个月</b><small>到期日 ${g.due} → ${lv.ext.due}。每月不用多出钱，目标晚一点实现。</small></button>` : ''}
        ${lv.reduce ? `<button type="button" class="lever" data-act="lever" data-goal="${g.id}" data-kind="reduce"><b>目标下调 ${lv.reduce.pct}%</b><small>${Y(g.target)} → ${Y(lv.reduce.newTarget)}。每月投入不变。</small></button>` : ''}
      </div></div>` : ''}
  </article>`;
}

function actCard(a, i = 0) {
  const g = goal(a.goal_id);
  const pct = a.amount ? Math.min(100, Math.round((a.actual * 100) / a.amount)) : 0;
  const recs = a.records.map((e) => `${md(e.date)} · ${esc(asset(e.asset_id)?.name || '')} → ${esc(asset(e.target_asset_id)?.name || '')} · ${Y(e.target_amount ?? e.amount)}`);
  const recAttr = `data-kind="contribution" data-action="${a.id}"`;
  return `<article class="card act rv ${UI.pulse === a.id ? 'pulse' : ''}" style="--i:${i}" id="act-${a.id}" ${i === 3 ? fix('I3') : ''}>
    <div>
      <div class="row"><h3>${esc(g.name)}</h3>${statusChip(a.status)}${a.excess ? chip(`超出 ${Y(a.excess)}`, 'warn') : ''}</div>
      <p class="muted small">${monthLabel(a.month)}投入计划</p>
      <div class="figs"><div><small>本月计划</small><b>${Y(a.amount)}</b></div><div><small>已投入</small><b>${Y(a.actual)}</b></div><div><small>还需投入</small><b>${Y(a.remaining)}</b></div></div>
    </div>
    <div class="side">${a.status === 'completed' ? btn('再记一笔', { cls: 'ghost sm', act: 'open-record', data: recAttr }) : btn('记录本次投入', { cls: 'primary', act: 'open-record', data: recAttr })}</div>
    <div class="bar ${a.status === 'completed' ? 'done' : ''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(g.name)}本月投入进度"><i style="width:${pct}%"></i></div>
    <div class="recs">${recs.length ? recs.join('<br>') : '本月还没有投入记录。'}</div>
  </article>`;
}

function viewOverview() {
  if (S.rev === 0) return emptyOverview();
  const R = RES();
  if (R.incomplete) {
    return `${pageHead({ eyebrow: '建档还没填完', title: '我的规划', lede: '资料不完整时，数字不会被当成 0。' })}
    <section class="card empty rv" style="--i:2"><h2>先把这几项补上</h2><ul class="stack">${R.missing.map((m) => `<li class="row">${ic('alert', 18)}<span>${esc(m)}</span></li>`).join('')}</ul><div class="row">${btn('去补全建档', { cls: 'primary', href: '#/household' })}</div></section>`;
  }
  const acts = ACTS();
  const p = plan();
  const info = monthInfo();
  const est = R.rows.filter((r) => r.quality === 'estimated');
  const reserveOk = R.reserveShortfall === 0;
  const goalsTotal = R.goals.reduce((s, g) => s + g.affordable, 0);
  const incomeBase = Math.max(R.income, R.expenses + R.minimum + goalsTotal + R.unlinked);
  const w = (x) => `${((x / incomeBase) * 100).toFixed(2)}%`;
  const strata = [['reserve', '应急预留', R.reserve], ['alloc', '已分给目标', R.cashAllocated], ['free', '可自由安排', R.free]];
  const assetRowName = (r) => `${esc(r.name)}${r.quality === 'estimated' ? '（估算）' : ''}`;
  return `
  ${pageHead({ eyebrow: `${info.label} · 第 ${info.day} 天，共 ${info.n} 天`, title: '我的规划', lede: '让每一笔钱，都有下一步。', meta: planMeta() })}

  <section class="hero rv" style="--i:2">
    <div class="hero-main" ${fix('N1')}>
      <p class="eyebrow">可自由安排的现金</p>
      <p class="hero-num" aria-label="${Y(R.free)}">${bigMoney(R.free)}</p>
      <p class="hero-sub">账户现金共 <b class="num">${Y(R.cash)}</b>。其中 <b class="num">${Y(R.reserve)}</b> 是应急预留（必要支出 ${Y(S.household.essential, { dec: false })} × ${S.household.reserve_months} 个月），<b class="num">${Y(R.cashAllocated)}</b> 已经分给了目标——剩下的，才是能自由安排的钱。</p>
      <div class="strata">
        <div class="strata-bar" role="img" aria-label="现金构成：应急预留 ${Y(R.reserve)}，已分给目标 ${Y(R.cashAllocated)}，可自由安排 ${Y(R.free)}">
          ${strata.map(([k, n, v]) => `<div class="seg ${k}" style="flex:${Math.max(v, 1)}"><span>${n}</span></div>`).join('')}
        </div>
        <div class="strata-legend">
          ${ld({ sw: 'reserve', label: `应急预留 ${reserveOk ? chip('已备足', 'up') : chip(`缺口 ${Y(R.reserveShortfall)}`, 'warn')}`, sub: '先留足，不参与分配', amount: Y(R.reserve) })}
          ${ld({ sw: 'alloc', label: '已分给目标', sub: R.goals.filter((g) => S.household.allocations.some((a) => a.goal_id === g.id && asset(a.asset_id).kind === 'cash')).map((g) => g.name).join('、'), amount: Y(R.cashAllocated) })}
          ${ld({ sw: 'free', label: '可自由安排', sub: '没有用途标记的现金', amount: Y(R.free) })}
          ${ld({ cls: 'total', label: '账户现金合计', amount: Y(R.cash) })}
        </div>
      </div>
    </div>
    <aside class="card nw">
      <p class="eyebrow">净资产 ${est.length ? chip(`含 ${est.length} 项估算`, 'warn') : ''}</p>
      <p class="nw-num">${bigMoney(R.netWorth)}</p>
      <div class="nw-bars" role="list" aria-label="净资产构成">
        ${R.rows.slice().sort((a, b) => b.balance - a.balance).map((r) => `<div class="nwb" role="listitem"><div class="nwb-top"><span>${esc(r.name)}${r.liq !== 'available' ? ' <span class="sub">不易变现</span>' : ''}</span><b class="num">${Y(r.balance, { dec: false })}</b></div><div class="nwb-bar ${r.liq !== 'available' ? 'ill' : ''}"><i style="width:${Math.max((r.balance / Math.max(R.assetsTotal, 1)) * 100, 1.2).toFixed(2)}%"></i></div></div>`).join('')}
        ${R.debtTotal ? `<div class="nwb" role="listitem"><div class="nwb-top"><span>负债 <span class="sub">${S.household.debts.map((d) => esc(d.name)).join('、')}</span></span><b class="num neg">−${Y(R.debtTotal, { dec: false })}</b></div><div class="nwb-bar debt"><i style="width:${Math.max((R.debtTotal / Math.max(R.assetsTotal, 1)) * 100, 1.2).toFixed(2)}%"></i></div></div>` : ''}
      </div>
      <p class="hint" style="margin-top:14px">房产与受限资产计入净资产，但不会算进可自由安排的现金。</p>
      ${R.warnings.length ? `<details><summary>${ic('chev', 16)}哪些是估算？</summary><p class="hint">${R.warnings.map(esc).join('；')}。估算值已在建档里标注，换成真实数字后这里会更准。</p></details>` : ''}
    </aside>
  </section>

  <div class="two sec" style="margin-top:36px">
    <section class="rv" style="--i:3" aria-label="本月行动">
      ${secHead('01', '本月行动', acts.length ? `${acts.filter((a) => a.status === 'completed').length} / ${acts.length} 已完成` : '')}
      ${acts.length ? acts.map((a, i) => actCard(a, i + 3)).join('') : `<div class="card pad"><p class="muted">${p ? '这个月还没有投入计划。' : '确认方案后，这里会出现本月要做的事。'}</p><div class="row" style="margin-top:12px">${btn(p ? '去生成本月计划' : '去试算', { cls: 'primary', href: p ? '#/execution' : '#/scenarios' })}</div></div>`}
    </section>
    <section class="rv" style="--i:4" aria-label="本月预算">
      ${secHead('02', '本月预算', `每月 ${Y(R.income, { dec: false })} 的去向`)}
      <div class="card pad" ${fix('N5')}>
        ${ld({ sign: '＋', label: '月收入', amount: Y(R.income) })}
        ${ld({ sign: '−', sw: 'c-exp', label: '月支出', note: `其中必要支出 ${Y(S.household.essential, { dec: false })}`, amount: `−${Y(R.expenses)}` })}
        ${ld({ sign: '−', sw: 'c-debt', label: '最低还款', note: S.household.debts.filter((d) => !d.in_expenses).map((d) => esc(d.name)).join('、'), amount: `−${Y(R.minimum)}` })}
        ${ld({ sign: '−', sw: 'c-goal', label: '目标投入', note: R.goals.map((g) => `${esc(g.name)} ${Y(g.affordable, { dec: false })}`).join(' + '), amount: `−${Y(goalsTotal + R.unlinked)}` })}
        ${ld({ cls: 'total', sign: '＝', sw: 'c-left', label: '本月可再分配', amount: Y(R.remaining) })}
        <div class="tape-bar" role="img" aria-label="收入的去向：支出、最低还款、目标投入、剩余">
          <span class="c-exp" style="width:${w(R.expenses)}"></span><span class="c-debt" style="width:${w(R.minimum)}"></span><span class="c-goal" style="width:${w(goalsTotal + R.unlinked)}"></span><span class="c-left" style="width:${w(Math.max(R.remaining, 0))}"></span>
        </div>
        <p class="hint">${R.goals.some((g) => g.floorBinds || g.floor) ? `已有定投 ${Y(R.goals.reduce((s, g) => s + g.floor, 0))} 已包含在目标投入里，不会重复扣减。` : ''}${R.errors.length ? R.errors.map(esc).join('；') : ''}</p>
      </div>
    </section>
  </div>

  <section class="sec" aria-label="目标进度">
    ${secHead('03', '目标进度', '按优先级排：资金不够时，靠前的目标先拿到预算')}
    ${R.goals.map((g, i) => goalCard(g, R, i)).join('')}
  </section>

  <section class="sec rv" style="--i:7" aria-label="数字从哪来">
    ${secHead('04', '这些数字从哪来', `测算日 ${S.today} · 账目修订 ${S.rev}`)}
    <div class="card prov" ${fix('N3')}>
      <details open><summary>${ic('chev', 16)}账户余额 = 基准 + 已记流水</summary>
        ${R.rows.map((r) => {
          const n = r.moves.length;
          const eq = n
            ? `基准 <b>${Y(r.anchor)}</b>（${md(r.observed_on)} 日终 · ${r.quality === 'estimated' ? '估算' : '已核实'}）${r.moved < 0 ? '−' : '＋'} 已记流水 <b>${Y(Math.abs(r.moved))}</b>（${n} 笔）＝ <b>${Y(r.balance)}</b>（截至 ${md(S.today)}）`
            : `基准 <b>${Y(r.anchor)}</b>（${md(r.observed_on)} 日终 · ${r.quality === 'estimated' ? '估算' : '已核实'}），之后没有流水`;
          return `<div class="item"><div class="row"><b>${assetRowName(r)}</b><span class="sp"></span>${r.kind === 'cash' ? `<button class="btn ghost sm" type="button" data-act="recon-open" data-asset="${r.id}" ${fix('P4')}>对账</button>` : ''}</div><p class="eq">${eq}</p></div>`;
        }).join('')}
        <p class="hint" style="margin-top:12px">只记一部分流水时，这里的余额会逐渐偏离银行里的数字——用「对账」填入银行实际余额，系统会生成一条可作废的差额调整，基准日不变。</p>
      </details>
    </div>
  </section>`;
}

/* ---------- 执行与复盘 ---------- */
function ribbon() {
  const i = monthInfo();
  const past = ((i.day / i.n) * 100).toFixed(2);
  const zl = (((i.zoneStart - 1) / i.n) * 100).toFixed(2);
  const zw = (((i.n - i.zoneStart + 1) / i.n) * 100).toFixed(2);
  return `<section class="card ribbon rv" style="--i:2" ${fix('P1')} aria-label="本月进度">
    <div class="ribbon-top"><b>${i.label}</b><span class="muted">第 ${i.day} 天 / 共 ${i.n} 天 · ${i.left ? `距月末还有 ${i.left} 天` : '今天是月末最后一天'}</span><span class="sp"></span>${chip(`复盘建议期 ${i.zoneStart}–${i.n} 日`, 'warn')}</div>
    <div class="ribbon-track"><span class="zone" style="left:${zl}%;width:${zw}%"></span><span class="past" style="width:${past}%"></span><span class="now" style="left:${past}%"></span></div>
    <div class="ribbon-scale"><span>1 日</span><span>边做边记 · 月底复盘</span><span>${i.n} 日</span></div>
  </section>`;
}

function renewCard() {
  const p = plan();
  const R = RES();
  const info = monthInfo();
  const gaps = R.goals.filter((g) => g.shortfall > 0);
  return `<section class="card renew rv" style="--i:3" ${fix('P1')}>
    <h3>${info.label}还没有投入计划</h3>
    <p>方案 v${p.version} 仍在使用。要在这个月继续记投入，需要你确认「沿用 v${p.version}」——不会自动改动任何金额，也不会交易或移动资金。</p>
    <div class="stack" style="gap:6px">${R.goals.map((g) => ld({ label: esc(g.name), sub: `还剩 ${g.months} 个月`, amount: Y(g.affordable) })).join('')}</div>
    ${gaps.length ? `<label class="consent"><input type="checkbox" data-act="renew-consent" ${UI.renewConsent ? 'checked' : ''}><span>我已了解：${gaps.map((g) => `「${esc(g.name)}」按现在的投入仍有 ${Y(g.shortfall)} 缺口`).join('；')}。</span></label>` : ''}
    <div class="row">
      <button class="btn primary" type="button" data-act="renew" ${gaps.length && !UI.renewConsent ? 'disabled' : ''}>沿用方案，生成本月计划</button>
      ${btn('先去试算调整', { href: '#/scenarios' })}
      ${gaps.length && !UI.renewConsent ? '<span class="hint">勾选上面的确认后才能沿用。</span>' : ''}
    </div>
  </section>`;
}

function ledgerRows() {
  const items = S.ledger.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const f = UI.filter;
  const rows = items.filter((e) => (f === 'all' ? true : f === 'voided' ? e.voided : f === 'forecast' ? !e.voided && e.state === 'forecast' : !e.voided && e.state === 'confirmed'));
  if (!rows.length) return `<tr><td colspan="5" class="muted" style="padding:28px 14px">${f === 'all' ? '还没有记录。点上面的「记录本次投入」或「＋ 记一笔」开始。' : '这个筛选下没有记录。'}</td></tr>`;
  const kindName = { income: '收入', expense: '支出', transfer: '转账', debt_payment: '还款' };
  return rows.map((e) => {
    const src = asset(e.asset_id);
    const tgt = asset(e.target_asset_id);
    const amt = Y(e.amount);
    const arrive = Y(e.target_amount ?? e.amount);
    const lines = e.kind === 'income' ? [`<span class="plus">${esc(src?.name)} ＋${amt}</span>`]
      : e.kind === 'transfer' ? [`<span class="minus">${esc(src?.name)} −${amt}</span>`, `<span class="plus">${esc(tgt?.name)} ＋${arrive}</span>`]
      : [`<span class="minus">${esc(src?.name)} −${amt}</span>`];
    const g = e.goal_id ? goal(e.goal_id) : null;
    const st = e.voided ? 'voided' : e.state;
    return `<tr class="${e.voided ? 'void' : ''}">
      <td class="num" style="white-space:nowrap">${e.date}<div class="faint small">${dow(e.date)}</div></td>
      <td><span class="strike"><b>${e.adjust ? '对账调整' : g ? '投入目标' : kindName[e.kind]}</b>${g ? ` · ${esc(g.name)}` : ''}</span>
        <div class="faint small">${e.mode === 'move_existing' ? '移动已分配资金，不计入进度' : g ? '新增投入 · 计入本月进度' : ''}${e.note ? ` ${esc(e.note)}` : ''}${e.source ? ` · ${esc(e.source)}` : ''}</div></td>
      <td><div class="eff">${lines.join('')}</div></td>
      <td>${statusChip(st)}</td>
      <td class="r">${!e.voided ? `<button class="btn sm" type="button" data-act="void-open" data-id="${e.id}" ${fix('I7')}>作废</button>` : ''}</td>
    </tr>`;
  }).join('');
}

function monthReview(m, closing) {
  const ev = S.ledger.filter((e) => !e.voided && e.state === 'confirmed' && e.date.startsWith(m));
  const sum = (k) => ev.filter((e) => e.kind === k);
  const total = (arr) => arr.reduce((s, e) => s + e.amount, 0);
  const inc = sum('income');
  const exp = sum('expense');
  const debt = sum('debt_payment');
  const p = plan();
  const acts = actionsFor(p, S.ledger, m, S.today);
  const info = monthInfo();
  const left = m === info.m ? info.left : 0;
  const tile = (name, arr, hint) => `<div class="tile"><small>${name}</small>${arr.length ? `<b>${Y(total(arr))}</b><span>已记录 ${arr.length} 笔</span>` : `<b class="none">未记录</b><span>${hint}</span>`}</div>`;
  const stale = S.reviewRev != null && S.reviewRev !== S.rev;
  return `<article class="card review rv" style="--i:2" ${fix('N2')}>
    <div class="row"><h3 style="font:700 20px var(--font-sans)">${monthLabel(m)}${closing ? '收官复盘' : '复盘'}</h3>${closing ? chip('本月已结束', 'plain') : chip(`进行中 · 还剩 ${left} 天`, 'olive')}${stale && !closing ? chip('有新记录，建议更新', 'warn') : ''}<span class="sp"></span>
      ${closing ? btn('更新为收官复盘', { cls: 'sm', act: 'review-make', data: `data-m="${m}"` }) : btn(S.reviewRev != null ? '更新本月复盘' : '生成本月复盘', { cls: 'primary sm', act: 'review-make', data: `data-m="${m}"` })}</div>
    <div class="review-banner">${ic('info', 18)}<span>${closing ? `${monthLabel(m)}已经结束，这是最后一次对照；<b>${md(monthAfter(m + '-01', 1).slice(0, 7) + '-10')} 前可以补做</b>，之后只读。` : `截至 ${md(S.today)}，这个月还没结束。`}这里只统计你确认过的记录——<b>没有记录不等于没有收支</b>。</span></div>
    <div class="tiles">
      ${tile('已记录收入', inc, `建档里预计 ${Y(S.household.income, { dec: false })}/月，不会自动记为实际`)}
      ${tile('已记录支出', exp, `建档里预计 ${Y(S.household.expenses, { dec: false })}/月`)}
      ${tile('已记录还款', debt, `最低还款 ${Y(S.household.debts[0]?.minimum || 0, { dec: false })}/月`)}
    </div>
    <div style="margin-top:20px">
      ${acts.map((a) => {
        const g = goal(a.goal_id);
        const pc = a.amount ? Math.min(100, Math.round((a.actual * 100) / a.amount)) : 0;
        const verdict = a.status === 'completed' ? chip(`${ic('check', 14, 2)}已达成`, 'up') : closing ? chip(`未达成 · 差 ${Y(a.remaining)}`, 'down') : chip(`进行中 · 还差 ${Y(a.remaining)}`, 'olive');
        return `<div class="rv-goal"><div class="row"><b>${esc(g.name)}</b>${verdict}</div><div class="num"><b>${Y(a.actual)}</b> <span class="muted">/ ${Y(a.amount)}</span></div><div class="bar ${a.status === 'completed' ? 'done' : ''}"><i style="width:${pc}%"></i></div></div>`;
      }).join('') || '<p class="muted">这个月没有投入计划可对照。</p>'}
    </div>
    <div class="row" style="margin-top:18px">${btn('按偏差调整方案', { href: '#/scenarios', icon: 'arrow' })}<span class="hint">复盘不会修改建档或流水。</span></div>
  </article>`;
}

function viewExecution() {
  if (S.rev === 0) return needHousehold('每月做一点，变化看得见。');
  const p = plan();
  const acts = ACTS();
  const info = monthInfo();
  const isNew = S.today.slice(0, 7) !== '2026-10';
  const rec = S.reviewRev != null;
  const filters = [['all', '全部'], ['confirmed', '已发生'], ['forecast', '预计'], ['voided', '已作废']];
  return `
  ${pageHead({ eyebrow: info.label, title: '每月做一点，变化看得见。', lede: '记下真实发生的事，再与方案对照。', meta: `${btn('＋ 记一笔', { cls: 'primary', act: 'open-record', data: 'data-kind="expense"' })}${planMeta()}` })}
  ${ribbon()}
  <section class="sec" aria-label="本月投入计划">
    ${secHead('01', '本月投入计划', acts.length ? `${monthLabel(info.m)} · 记录投入后进度自动累计` : '')}
    ${!p ? `<div class="card pad"><p class="muted">还没有使用中的方案。先去试算并确认一份方案，这里才会出现本月计划。</p><div class="row" style="margin-top:12px">${btn('去方案测算', { cls: 'primary', href: '#/scenarios' })}</div></div>`
      : acts.length ? `<div class="stack">${acts.map((a, i) => actCard(a, i + 3)).join('')}</div>` : renewCard()}
  </section>
  <section class="sec rv" style="--i:5" aria-label="流水与预测">
    ${secHead('02', '流水与预测', '只有「已发生」会改动余额；预计不入账')}
    <div class="row" style="margin-bottom:14px"><div class="filters" role="group" aria-label="筛选">${filters.map(([k, n]) => `<button type="button" data-act="filter" data-f="${k}" aria-pressed="${UI.filter === k}">${n}</button>`).join('')}</div><span class="sp"></span>${btn('＋ 记一笔', { cls: 'sm', act: 'open-record', data: 'data-kind="expense"' })}</div>
    <div class="card ledger-wrap"><table class="ledger"><thead><tr><th>日期</th><th>说明</th><th class="r">账户变化</th><th>状态</th><th class="r">操作</th></tr></thead><tbody>${ledgerRows()}</tbody></table></div>
  </section>
  <section class="sec" aria-label="复盘">
    ${secHead('03', isNew ? '复盘' : '本月复盘', '每月一次，对照计划与实际')}
    ${isNew
      ? `<div class="stack">${rec ? monthReview('2026-10', true) : ''}${`<div class="card pad rv" style="--i:2"><div class="row"><b>${info.label}复盘</b>${chip(`进行中 · 还剩 ${info.left} 天`, 'olive')}<span class="sp"></span>${btn('生成本月复盘', { cls: 'primary sm', act: 'review-make', data: `data-m="${info.m}"` })}</div><p class="hint" style="margin-top:8px">还没有生成。月底前（${info.zoneStart}–${info.n} 日）生成即可，也可以中途先看看。</p></div>`}</div>`
      : rec ? monthReview(info.m, false)
      : `<div class="card pad rv" style="--i:2"><div class="row"><b>${info.label}复盘</b>${chip(`进行中 · 还剩 ${info.left} 天`, 'olive')}<span class="sp"></span>${btn('生成本月复盘', { cls: 'primary sm', act: 'review-make', data: `data-m="${info.m}"` })}</div><p class="hint" style="margin-top:8px">还没有生成。月底前（${info.zoneStart}–${info.n} 日）生成即可，也可以中途先看看。${info.day >= info.zoneStart ? '今天已经进入复盘建议期。' : ''}</p></div>`}
  </section>`;
}

/* ============================================================
   原型主程序 · 第 3 段：方案测算、财务建档
   ============================================================ */

/* ---------- 试算条件：界面用 % 与元，引擎用小数与分（I5） ---------- */
function scenFromParams(pr) {
  const s = blankScen();
  if (pr.extraIncome) s.extraIncome = centsInput(pr.extraIncome);
  if (pr.extraExpenses) s.extraExpenses = centsInput(pr.extraExpenses);
  if (pr.reducePct) s.reducePct = String(pr.reducePct);
  if (pr.ret) s.ret = String(pr.ret);
  if (pr.infl) s.infl = String(pr.infl);
  if (pr.extend) s.extend = pr.extend;
  Object.entries(pr.monthly || {}).forEach(([k, v]) => { s.monthly[k] = centsInput(v); });
  return s;
}
function mergeParams(base, patch) {
  return { ...base, ...patch, monthly: { ...(base.monthly || {}), ...(patch.monthly || {}) } };
}
function scenParse(sc) {
  const E = {};
  const money = (k) => {
    const v = String(sc[k] ?? '').trim();
    if (v === '') return 0;
    const c = parseCents(v);
    if (c === null) { E[k] = '请只填数字，最多两位小数（单位：元）'; return 0; }
    return c;
  };
  const pct = (k, lo, hi, label) => {
    const v = String(sc[k] ?? '').trim().replace('%', '');
    if (v === '') return 0;
    const n = Number(v);
    if (!isFinite(n)) { E[k] = '请填数字，例如 3 就是 3%'; return 0; }
    const pc = (x) => `${x < 0 ? '−' : ''}${Math.abs(x)}%`;
    if (n < lo || n > hi) { E[k] = `${label}需要在 ${pc(lo)} 到 ${pc(hi)} 之间`; return 0; }
    return n;
  };
  const params = {
    extraIncome: money('extraIncome'), extraExpenses: money('extraExpenses'),
    reducePct: pct('reducePct', 0, 100, '目标下调'), ret: pct('ret', -90, 50, '年化收益假设'), infl: pct('infl', 0, 30, '年通胀假设'),
    extend: Number(sc.extend) || 0, monthly: {},
  };
  S.household.goals.forEach((g) => {
    const v = String(sc.monthly[g.id] ?? '').trim();
    if (v !== '') {
      const c = parseCents(v);
      if (c === null) E['m-' + g.id] = '请只填数字，最多两位小数（单位：元）';
      else params.monthly[g.id] = c;
    }
  });
  return { params, E };
}
const scenTabs = () => ['A', 'B', 'C'].filter((k) => UI.scen[k]);

/* ---------- 对比表 ---------- */
function dcell(val, base, better, f = Y) {
  const d = val - base;
  const cls = d === 0 ? 'same' : (better === 'high') === d > 0 ? 'good' : 'bad';
  const txt = d === 0 ? '与当前方案相同' : `${d > 0 ? '＋' : '−'}${f(Math.abs(d))}`;
  return `<td class="${d ? 'chg' : ''}">${f(val)}<span class="delta ${cls}">${txt}</span></td>`;
}
function scenResults() {
  const p = plan();
  const base = RES();
  const cols = scenTabs().map((k) => {
    const { params, E } = scenParse(UI.scen[k]);
    return { k, E, params, res: calc(S.household, S.ledger, params, S.today) };
  });
  const active = cols.find((c) => c.k === UI.scen.tab) || cols[0];
  const head = `<tr><th></th><th class="base">${p ? `当前方案 v${p.version}` : '当前建档'}</th>${cols.map((c) => `<th>试算 ${c.k}${c.k === UI.scen.tab ? ' · 编辑中' : ''}</th>`).join('')}</tr>`;
  const out = [`<tr><td>每月可再分配</td><td class="base"><b>${Y(base.remaining)}</b></td>${cols.map((c) => dcell(c.res.remaining, base.remaining, 'high')).join('')}</tr>`];
  base.goals.forEach((g, gi) => {
    out.push(`<tr class="grp"><td colspan="${2 + cols.length}">${esc(g.name)} <span class="muted small" style="font-weight:400">· 第 ${g.priority} 优先 · 目标 ${Y(g.target)}</span></td></tr>`);
    out.push(`<tr><td>每月投入</td><td class="base"><b>${Y(g.affordable)}</b>${g.floor ? `<span class="delta same">${ic('lock', 12, 2)} 含已有定投 ${Y(g.floor)}（下限）</span>` : ''}</td>${cols.map((c) => dcell(c.res.goals[gi].affordable, g.affordable, 'high')).join('')}</tr>`);
    out.push(`<tr><td>到期日</td><td class="base"><b>${g.due}</b></td>${cols.map((c) => { const d = c.res.goals[gi].due; return `<td class="${d !== g.due ? 'chg' : ''}">${d}${d !== g.due ? '<span class="delta same">已延期</span>' : ''}</td>`; }).join('')}</tr>`);
    out.push(`<tr><td>到期测算</td><td class="base"><b>${Y(g.projected)}</b></td>${cols.map((c) => dcell(c.res.goals[gi].projected, g.projected, 'high')).join('')}</tr>`);
    out.push(`<tr><td>预计缺口</td><td class="base"><b>${g.shortfall ? Y(g.shortfall) : '无 ✓'}</b></td>${cols.map((c) => dcell(c.res.goals[gi].shortfall, g.shortfall, 'low')).join('')}</tr>`);
  });
  const errs = active ? [...Object.values(active.E), ...active.res.errors] : [];
  const bad = !!active && (Object.keys(active.E).length > 0 || active.res.errors.length > 0);
  return `<div class="card" ${fix('I6')}><div class="ledger-wrap"><table class="cmp"><thead>${head}</thead><tbody>${out.join('')}</tbody></table></div></div>
  ${errs.length ? `<div class="summary-err" role="alert" style="margin-top:14px">${ic('alert', 18)}<div>${errs.map((e) => `<div>${esc(e)}</div>`).join('')}${active.res.errors.length ? '<div style="font-weight:400;margin-top:4px">这套条件目前不可执行，不能生成方案草案。</div>' : ''}</div></div>` : ''}
  <div class="row" style="margin-top:16px">
    <button class="btn primary" type="button" data-act="scen-draft" ${bad ? 'disabled' : ''}>把「试算 ${active ? active.k : 'A'}」生成方案草案</button>
    <span class="hint">生成草案不会改变账目或当前方案；确认之后才生效。</span>
  </div>`;
}

function field(label, inner, { hint = '', err = '', id = '' } = {}) {
  const auto = id || ((inner.match(/\sid="([^"]+)"/) || [])[1] || '');   // 自动把标签和第一个带 id 的控件关联起来
  return `<div class="field"><label class="lab" ${auto ? `for="${auto}"` : ''}>${label}</label>${inner}${err ? `<div class="errmsg" role="alert">${ic('alert', 15)}<span>${esc(err)}</span></div>` : ''}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
function scenInput(k, label, { unit = '元', hint = '', placeholder = '0' } = {}) {
  const sc = UI.scen[UI.scen.tab];
  const { E } = scenParse(sc);
  const base = scenFromParams(planParams());
  const changed = String(sc[k] ?? '') !== String(base[k] ?? '');
  const isMoney = unit === '元';
  return field(label, `<div class="pre ${isMoney ? 'l' : 'r'}">${isMoney ? '<span>¥</span>' : `<span>${unit}</span>`}<input class="in ${E[k] ? 'err' : ''} ${changed ? 'changed' : ''}" id="sc-${k}" inputmode="decimal" autocomplete="off" placeholder="${placeholder}" value="${esc(sc[k])}" data-bind="scen.${k}" data-k="sc-${k}"></div>`, { hint, err: E[k] || '' });
}
function scenControls() {
  const sc = UI.scen[UI.scen.tab];
  const { E } = scenParse(sc);
  const R = RES();
  const base = scenFromParams(planParams());
  const tabs = scenTabs();
  const goalInputs = S.household.goals.map((g, gi) => {
    const rg = R.goals[gi];
    const key = 'm-' + g.id;
    const raw = sc.monthly[g.id] ?? '';
    const typed = raw === '' ? null : parseCents(raw);
    const locked = rg.floor > 0;
    const below = locked && typed != null && typed < rg.floor;
    const placeholder = centsInput(rg.affordable);
    const baseRaw = base.monthly[g.id] ?? '';
    const changed = String(raw) !== String(baseRaw);
    return `<div class="field"><label class="lab" for="sc-${key}">${esc(g.name)} · 每月投入${locked ? ` <span class="chip warn" style="height:22px">${ic('lock', 12, 2)}含定投</span>` : ''}</label>
      <div class="pre l"><span>¥</span><input class="in ${E[key] ? 'err' : ''} ${changed ? 'changed' : ''}" id="sc-${key}" inputmode="decimal" autocomplete="off" placeholder="${placeholder}" value="${esc(raw)}" data-bind="scen.monthly.${g.id}" data-k="sc-${key}"></div>
      ${E[key] ? `<div class="errmsg" role="alert">${ic('alert', 15)}<span>${esc(E[key])}</span></div>` : ''}
      ${locked ? `<div class="lock ${below ? '' : ''}" ${fix('I4')}>${ic('lock', 15, 2)}<span>${below ? `你填的 ${Y(typed)} 低于已有定投 <b>${Y(rg.floor)}</b>/月，已按 ${Y(rg.floor)} 计算。` : `已有定投 <b>${Y(rg.floor)}</b>/月，是这个目标每月投入的下限。`}要试算「暂停定投」，请先到建档里调整定投。</span></div>` : `<div class="hint">留空 = 沿用当前方案（${Y(rg.affordable)}）</div>`}</div>`;
  }).join('');
  return `<aside class="card scen-controls rv" style="--i:3" aria-label="试算条件">
    <div class="scen-tabs" role="tablist" aria-label="试算">
      ${tabs.map((k) => `<button type="button" class="tab" role="tab" aria-selected="${UI.scen.tab === k}" data-act="scen-tab" data-t="${k}">试算 ${k}</button>`).join('')}
      ${tabs.length < 3 ? `<button type="button" class="btn ghost sm" data-act="scen-add">${ic('plus', 15, 2)}新试算</button>` : ''}
    </div>
    <p class="hint">在这里随便算：不改账目，也不改当前方案。所有比例都用 %，填 3 就是 3%。</p>
    <div class="group-title">收支假设</div>
    ${scenInput('extraIncome', '每月额外收入', { hint: '例如年终奖折算到每月；只用于试算，不会写进收支。' })}
    ${scenInput('extraExpenses', '每月额外支出')}
    <div class="group-title">目标与市场假设</div>
    ${scenInput('reducePct', '目标金额下调', { unit: '%', hint: '填 8 表示把每个目标都降低 8%。' })}
    ${scenInput('ret', '年化收益假设', { unit: '%', hint: '默认 0%。这是假设，不是收益保证。' })}
    ${scenInput('infl', '年通胀假设', { unit: '%', hint: '默认 0%。填 2 表示每年物价涨 2%，目标金额会相应变大。' })}
    ${field('延期目标', `<div class="stepper" role="group" aria-label="延期月数"><button type="button" data-act="ext" data-d="-1" aria-label="少 1 个月">−</button><output>${sc.extend || 0} 个月</output><button type="button" data-act="ext" data-d="1" aria-label="多 1 个月">＋</button></div>`, { hint: '所有目标的到期日一起往后推。' })}
    <div class="group-title">每月投入</div>
    ${goalInputs}
    <div class="row"><button class="btn sm" type="button" data-act="scen-reset">还原为当前方案</button>${tabs.length < 3 ? '<button class="btn sm ghost" type="button" data-act="scen-copy">复制为新试算</button>' : ''}</div>
  </aside>`;
}

function draftCard() {
  const d = S.pending;
  if (!d) return '';
  const p = plan();
  const stale = d.rev !== S.rev;
  const base = RES();
  const res = calc(S.household, S.ledger, d.params, S.today);
  const gaps = res.goals.filter((g) => g.shortfall > 0);
  const needConsent = gaps.length > 0 || res.reserveShortfall > 0;
  const next = (p ? p.version : 0) + 1;
  const lines = res.goals.map((g, i) => {
    const b = base.goals[i];
    const ch = (a, c, f = Y) => (a === c ? f(a) : `${f(c)} <span class="muted small">（原 ${f(a)}）</span>`);
    return `<tr><td>${esc(g.name)}</td><td class="r">${ch(b.affordable, g.affordable)}</td><td class="r">${ch(b.projected, g.projected)}</td><td class="r">${ch(b.shortfall, g.shortfall)}</td></tr>`;
  }).join('');
  const blocked = stale || (needConsent && !UI.draftConsent) || !res.executable;
  const why = stale ? '草案已过期，先重新测算。' : !res.executable ? '这份草案不可执行。' : needConsent && !UI.draftConsent ? '勾选上面的确认后才能采用。' : '';
  return `<section class="card draft ${stale ? 'stale' : ''} rv" style="--i:2" ${fix(stale ? 'P5' : 'I9')} aria-label="方案草案">
    <div class="row"><h3>方案草案 v${next} · ${stale ? '已过期' : '待确认'}</h3>${chip(`基于账目修订 ${d.rev}`, stale ? 'warn' : 'plain')}<span class="sp"></span><span class="muted small">${esc(d.created_at)}</span></div>
    ${stale ? `<p style="margin:10px 0 0;color:var(--warn);font-weight:600">${ic('alert', 16)} 生成草案之后，账目又有了新记录（现在是修订 ${S.rev}）。过期的草案不能确认。</p>` : '<p class="muted" style="margin-top:6px">确认前，先对照它和当前方案的差别：</p>'}
    <div class="ledger-wrap" style="margin:12px 0"><table class="cmp"><thead><tr><th>目标</th><th>每月投入</th><th>到期测算</th><th>预计缺口</th></tr></thead><tbody>${lines}</tbody></table></div>
    <p class="hint" style="margin-bottom:12px">确认后：为本月生成新的投入计划；方案 v${p ? p.version : 0} 保留为历史版本；不会自动交易，也不会移动资金。</p>
    ${needConsent && !stale ? `<label class="consent"><input type="checkbox" data-act="draft-consent" ${UI.draftConsent ? 'checked' : ''}><span>我已了解：${gaps.map((g) => `「${esc(g.name)}」仍有 ${Y(g.shortfall)} 缺口`).join('；')}${res.reserveShortfall > 0 ? `；应急预留还差 ${Y(res.reserveShortfall)}` : ''}。</span></label>` : ''}
    <div class="row" style="margin-top:14px">
      ${stale ? `<button class="btn primary" type="button" data-act="plan-retest">基于最新账目重新测算</button>` : `<button class="btn primary" type="button" data-act="plan-confirm" ${blocked ? 'disabled' : ''}>确认采用 v${next}</button>`}
      <button class="btn" type="button" data-act="plan-discard">放弃草案</button>
      ${why && !stale ? `<span class="hint">${why}</span>` : ''}
    </div>
  </section>`;
}

function versionsHTML() {
  const items = [];
  if (S.pending) items.push(`<li><div class="row"><b>草案</b>${chip(S.pending.rev !== S.rev ? '已过期' : '待确认', S.pending.rev !== S.rev ? 'warn' : 'plain')}<span class="muted small">${esc(S.pending.created_at)}</span></div></li>`);
  S.plans.slice().reverse().forEach((p) => items.push(`<li class="${p.status === 'active' ? 'on' : ''}"><div class="row"><b>方案 v${p.version}</b>${p.status === 'active' ? chip('使用中', 'up') : chip('历史版本', 'plain')}<span class="muted small">${esc(p.confirmed_at)} 确认</span></div><p class="muted small" style="margin:2px 0 0">${esc(p.summary)}</p></li>`));
  return `<ul class="vers" ${fix('N4')}>${items.join('') || '<li class="muted">还没有保存过方案。</li>'}</ul>`;
}

function viewScenarios() {
  if (S.rev === 0) return needHousehold('比较不同的安排');
  if (RES().incomplete) return `${pageHead({ eyebrow: '试算 → 方案', title: '比较不同的安排' })}<section class="card empty rv" style="--i:2"><h2>建档还没填完，先不试算</h2><ul class="stack">${RES().missing.map((m) => `<li class="row">${ic('alert', 18)}<span>${esc(m)}</span></li>`).join('')}</ul><div class="row">${btn('去补全建档', { cls: 'primary', href: '#/household' })}</div></section>`;
  return `
  ${pageHead({ eyebrow: '试算 → 方案', title: '比较不同的安排', lede: '先试算，再选一份生成方案草案，最后确认。每一步都不会动你的账目。', meta: planMeta() })}
  ${draftCard()}
  <div class="scen">
    ${scenControls()}
    <div>
      <div class="sec-head rv" style="--i:3;margin-top:0"><h2>结果对比</h2><p>改动过的格子会高亮；绿色=更好，红色=更差</p></div>
      <div id="scenResults" class="rv" style="--i:4">${scenResults()}</div>
      <section class="sec rv" style="--i:5"><div class="sec-head"><h2>方案版本</h2></div><div class="card pad">${versionsHTML()}</div></section>
    </div>
  </div>`;
}

/* ---------- 财务建档 ---------- */
const KIND_NAME = { cash: '现金账户', investment: '投资账户', property: '房产', other: '其他资产' };
const LIQ_NAME = { available: '可动用', restricted: '受限', illiquid: '不易变现' };
const Q_NAME = { verified: '已核实', estimated: '估算', unknown: '未知' };

function inMoney(path, { label, hint = '', ph = '', id }) {
  const v = UI.raw[path] ?? centsInput(getPath(UI.hh, path));
  const changed = getPath(UI.hh, path) !== getPath(S.household, path);
  const err = UI.rawErr[path];
  return field(label, `<div class="pre l"><span>¥</span><input class="in ${err ? 'err' : ''} ${changed ? 'changed' : ''}" id="${id || 'f-' + path}" inputmode="decimal" autocomplete="off" placeholder="${ph}" value="${esc(v)}" data-bind="hh.${path}" data-kind="money" data-k="f-${path}"></div>`, { hint, err: err ? '请只填数字，最多两位小数（单位：元）' : '' });
}
function inText(path, { label, hint = '', maxlength = 100 }) {
  const changed = getPath(UI.hh, path) !== getPath(S.household, path);
  return field(label, `<input class="in ${changed ? 'changed' : ''}" id="f-${path}" value="${esc(getPath(UI.hh, path))}" maxlength="${maxlength}" data-bind="hh.${path}" data-kind="text" data-k="f-${path}">`, { hint });
}
function inDate(path, { label, hint = '', max }) {
  const changed = getPath(UI.hh, path) !== getPath(S.household, path);
  return field(label, `<input type="date" class="in ${changed ? 'changed' : ''}" id="f-${path}" value="${esc(getPath(UI.hh, path))}" ${max ? `max="${max}"` : ''} data-bind="hh.${path}" data-kind="date" data-k="f-${path}">`, { hint });
}
function inSelect(path, opts, { label, hint = '' }) {
  const changed = getPath(UI.hh, path) !== getPath(S.household, path);
  return field(label, `<select class="in ${changed ? 'changed' : ''}" id="f-${path}" data-bind="hh.${path}" data-kind="select" data-k="f-${path}">${Object.entries(opts).map(([k, n]) => `<option value="${k}" ${getPath(UI.hh, path) === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`, { hint });
}

function completeness() {
  const h = UI.hh;
  const items = [
    ['资产', h.assets.length > 0 && h.assets.every((a) => a.amount != null), '至少一个账户，且余额都已填写'],
    ['月收入', h.income != null, '填写每月税后收入'],
    ['月支出', h.expenses != null && h.essential != null, '总支出与其中的必要支出'],
    ['负债', h.debts.length > 0 || h.no_debt, '没有负债也请勾选确认'],
    ['目标', h.goals.length > 0, '至少一个有金额和期限的目标'],
  ];
  return items;
}

function allocMatrix() {
  const h = UI.hh;
  const accts = h.assets.filter((a) => (a.kind === 'cash' || a.kind === 'investment') && a.liq === 'available');
  if (!accts.length || !h.goals.length) return `<p class="muted">先添加至少一个可动用账户和一个目标，才能分配资金。</p>`;
  const reserve = h.essential == null ? 0 : h.essential * h.reserve_months;
  const cell = (a, g) => {
    const idx = h.allocations.findIndex((x) => x.asset_id === a.id && x.goal_id === g.id);
    const path = `alloc.${a.id}.${g.id}`;
    const v = UI.raw[path] ?? (idx >= 0 ? centsInput(h.allocations[idx].amount) : '');
    return `<td><input class="in" aria-label="${esc(a.name)} 分给 ${esc(g.name)}" inputmode="decimal" placeholder="0" value="${esc(v)}" data-bind="alloc" data-asset="${a.id}" data-goal="${g.id}" data-k="${path}"></td>`;
  };
  const sum = (a) => h.allocations.filter((x) => x.asset_id === a.id).reduce((s, x) => s + x.amount, 0);
  const rows = accts.map((a) => {
    const free = (a.amount || 0) - (a.kind === 'cash' ? reserve : 0) - sum(a);

/* ---------- 记账草稿 ---------- */
const KINDS = [['contribution', '投入目标'], ['income', '收入'], ['expense', '支出'], ['debt', '还款'], ['transfer', '转账']];
const cashAccts = () => S.household.assets.filter((a) => a.kind === 'cash' && a.liq === 'available');
const moveTargets = (excludeId) => S.household.assets.filter((a) => a.id !== excludeId && ['cash', 'investment'].includes(a.kind) && a.liq === 'available');

function newDraft(kind = 'contribution', patch = {}) {
  const cash = cashAccts()[0];
  const tgt = moveTargets(cash && cash.id)[0];
  return {
    key: uid(), kind, state: 'confirmed', date: S.today, asset_id: cash ? cash.id : '', target_id: tgt ? tgt.id : '',
    goal_id: S.household.goals[0] ? S.household.goals[0].id : '', debt_id: S.household.debts[0] ? S.household.debts[0].id : '',
    amount: '', principal: '', quality: 'verified', source: '手动录入', note: '', action_id: null, ...patch,
  };
}
const isBlank = (d) => !d.amount && !d.note && !d.action_id && d.state === 'confirmed' && d.date === S.today;
function draftFromAction(a) {
  const base = newDraft('contribution');
  const assigned = S.household.allocations.filter((x) => x.goal_id === a.goal_id).map((x) => x.asset_id);
  const cands = moveTargets(base.asset_id);
  const target = cands.find((c) => assigned.includes(c.id)) || cands.find((c) => c.kind === 'investment') || cands[0];
  return { ...base, goal_id: a.goal_id, action_id: a.id, amount: a.remaining > 0 ? centsInput(a.remaining) : '', target_id: target ? target.id : '' };
}
function openRecord(kind, actionId) {
  UI.lastFocus = document.activeElement;
  if (actionId) {
    const a = ACTS().find((x) => x.id === actionId);
    const d = a ? draftFromAction(a) : newDraft('contribution');
    // 沿用原版的「草稿保护」：只替换空白草稿，已经写过的内容不覆盖，而是另加一条
    if (UI.drafts.length === 1 && isBlank(UI.drafts[0])) UI.drafts = [d]; else UI.drafts.push(d);
    UI.cur = UI.drafts.length - 1;
  } else if (!UI.drafts.length) {
    UI.drafts = [newDraft(kind || 'expense')]; UI.cur = 0;
  } else if (isBlank(UI.drafts[UI.cur])) {
    UI.drafts[UI.cur] = { ...newDraft(kind || 'expense'), key: UI.drafts[UI.cur].key };
  }
  UI.showErr = false;
  UI.overlay = { type: 'record' };
  UI.fresh = true;
  persist();
  renderOverlay();
}

/* 校验：文案是人话，并告诉你下一步怎么做（I3、P2） */
function balanceOf(id) { const r = RES().rows.find((x) => x.id === id); return r ? r.balance : null; }
function validate(d) {
  const E = [];
  const src = asset(d.asset_id);
  const amt = parseCents(d.amount);
  const actual = d.state === 'confirmed';
  if (!src) E.push({ f: 'asset', m: '请选择账户' });
  if (!String(d.amount).trim()) E.push({ f: 'amount', m: '请填写金额（只填正数）' });
  else if (amt === null) E.push({ f: 'amount', m: '金额格式不对：只填正数，最多两位小数' });
  else if (actual && amt === 0) E.push({ f: 'amount', m: '已发生的记录金额要大于零' });
  if (!d.date) E.push({ f: 'date', m: '请选择日期' });
  else if (actual && d.date > S.today) E.push({ f: 'date', m: '这是未来的日期。预计会发生的收支请选「预计」，它不会改动余额。' });
  else if (actual && src && d.date <= src.observed_on) E.push({ f: 'date', m: `早于「${src.name}」的日终基准（${md(src.observed_on)}）。已发生的记录要晚于这一天；如果是余额本身不对，请先去校准余额。`, link: src.id });
  if (actual && src && amt != null && d.kind !== 'income') {
    const b = balanceOf(src.id);
    if (b != null && b < amt) E.push({ f: 'amount', m: `会让「${src.name}」余额变成负数（${Y(b - amt)}）。` });
  }
  if (d.kind === 'contribution' || d.kind === 'transfer') {
    const t = asset(d.target_id);
    if (!t || t.id === d.asset_id) E.push({ f: 'target', m: '请选择不同的转入账户' });
    if (d.kind === 'contribution' && !d.goal_id) E.push({ f: 'goal', m: '请选择这笔钱投给哪个目标' });
    if (t && actual && d.date <= t.observed_on) E.push({ f: 'date', m: `早于「${t.name}」的日终基准（${md(t.observed_on)}）。`, link: t.id });
  }
  if (d.kind === 'debt') {
    const pr = parseCents(d.principal);
    if (!d.debt_id) E.push({ f: 'debt', m: '请选择所还的负债' });
    if (pr === null) E.push({ f: 'principal', m: '请填写其中的本金；纯利息填 0' });
    else if (amt != null && pr > amt) E.push({ f: 'principal', m: '本金不能超过本次还款总额' });
  }
  if (d.action_id && amt != null) {
    const a = ACTS().find((x) => x.id === d.action_id);
    if (a) {
      const others = UI.drafts.filter((x) => x.key !== d.key && x.action_id === d.action_id && x.state === 'confirmed').reduce((s, x) => s + (parseCents(x.amount) || 0), 0);
      if (others + amt > a.remaining && a.remaining > 0) E.push({ f: 'amount', m: `和同批里其它关联「${goal(a.goal_id).name}」的草稿合计 ${Y(others + amt)}，超过还需投入的 ${Y(a.remaining)}。如果确实多投了，可以保存，进度会显示「超出」。`, soft: true });
    }
  }
  return E;
}
const hardErrors = (d) => validate(d).filter((e) => !e.soft);

function previewHTML(d) {
  const R = RES();
  const amt = parseCents(d.amount);
  const forecast = d.state === 'forecast';
  const bal = (id) => { const r = R.rows.find((x) => x.id === id); return r ? r.balance : null; };
  const src = asset(d.asset_id);
  const tgt = d.kind === 'contribution' || d.kind === 'transfer' ? asset(d.target_id) : null;
  const rows = [];
  const line = (a, delta) => {
    if (!a) return;
    const b = bal(a.id);
    const after = amt == null || b == null ? null : b + delta;
    rows.push(`<div class="pv-row"><span>${esc(a.name)}</span><span class="range"><span class="from">${Y(b)}</span> <span class="arrow">→</span> <b>${after == null ? '待填写金额' : Y(after)}</b></span><span class="d ${delta < 0 ? 'minus' : 'plus'}">${amt == null ? '' : Y(delta, { sign: true })}</span></div>`);
  };
  const a = amt == null ? 0 : amt;
  if (d.kind === 'income') line(src, a);
  else if (d.kind === 'expense' || d.kind === 'debt') line(src, -a);
  else { line(src, -a); line(tgt, a); }
  let prog = '';
  if (d.kind === 'contribution' && d.goal_id) {
    const a = ACTS().find((x) => x.id === d.action_id);
    const g = goal(d.goal_id);
    if (a && amt != null && !forecast) prog = `<div class="pv-row"><span>本月进度 · ${esc(g.name)}</span><span class="range"><span class="from">${Y(a.actual)}</span> <span class="arrow">→</span> <b>${Y(a.actual + amt)} / ${Y(a.amount)}</b></span><span class="d plus">${a.actual + amt >= a.amount ? '达成' : ''}</span></div>`;
    else if (!a) prog = `<p class="hint" style="margin-top:6px">没有关联本月计划：只会记账，不计入本月进度。</p>`;
  }
  return `<div class="preview ${forecast ? 'forecast' : ''}" id="pv" aria-live="polite"><h4>${forecast ? '预计变化 · 不入账' : '保存后的余额变化'}</h4>${rows.join('')}${prog}</div>`;
}

      <div class="h-grid" style="grid-template-columns:1fr 1fr">${selAcct('asset_id', cashAccts(), 'asset', '从哪个账户转出')}${selAcct('target_id', moveTargets(d.asset_id), 'target', '转入哪个账户')}</div>${errHtml('asset')}${errHtml('target')}`,

/* ---------- 对话框 ---------- */
function dialogHTML(o) {
  const wrap = (title, body, foot) => `<div class="scrim" data-act="dlg-close"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" ${UI.fresh ? 'data-fresh' : ''}><h2 id="dlg-t">${title}</h2>${body}<div class="foot">${foot}</div></div>`;
  if (o.name === 'void') {
    const e = S.ledger.find((x) => x.id === o.id);
    const before = RES();
    const after = calc(S.household, S.ledger.filter((x) => x.id !== e.id), planParams(), S.today);
    const lines = [];
    ['asset_id', 'target_asset_id'].forEach((k) => {
      const id = e[k];
      if (!id) return;
      const b = before.rows.find((r) => r.id === id);
      const a = after.rows.find((r) => r.id === id);
      lines.push(`<div>${esc(b.name)}：${Y(b.balance)} → <b>${Y(a.balance)}</b></div>`);
    });
    const act = ACTS().find((x) => x.goal_id === e.goal_id);
    if (act && e.goal_id) {
      const na = actionsFor(plan(), S.ledger.filter((x) => x.id !== e.id), month(), S.today).find((x) => x.goal_id === e.goal_id);
      lines.push(`<div>「${esc(goal(e.goal_id).name)}」本月进度：${Y(act.actual)} → <b>${Y(na.actual)}</b>（计划 ${Y(act.amount)}）</div>`);
    }
    return wrap('作废这条记录？', `<p>${e.date} · ${e.goal_id ? '投入目标 · ' + esc(goal(e.goal_id).name) : '记录'} · ${Y(e.amount)}</p>
      <div class="impact"><b>作废之后</b>${lines.join('')}<div class="muted small">记录会留在历史里（标为已作废），不能恢复；需要的话请重新录入。</div></div>`,
      `<button class="btn" type="button" data-act="dlg-close">取消</button><button class="btn" type="button" data-act="void-redo" data-id="${e.id}">作废并重新录入</button><button class="btn danger" type="button" data-act="void-confirm" data-id="${e.id}">确认作废</button>`);
  }
  if (o.name === 'leave') {
    return wrap('有未保存的修改', `<p>建档里有 <b>${hhChanges()}</b> 处修改还没保存。离开之前想怎么处理？</p>`,
      `<button class="btn" type="button" data-act="dlg-close">继续编辑</button><button class="btn" type="button" data-act="leave-discard" data-to="${esc(o.to)}">放弃修改并离开</button><button class="btn primary" type="button" data-act="leave-save" data-to="${esc(o.to)}">保存并离开</button>`);
  }
  if (o.name === 'example') {
    return wrap('用示例覆盖当前内容？', `<p>这会把表单替换成虚构家庭的数据，你已经填写但还没保存的内容会丢失。已保存的建档不受影响，直到你再点「保存建档」。</p>`,
      `<button class="btn" type="button" data-act="dlg-close">取消</button><button class="btn danger" type="button" data-act="example-go">覆盖</button>`);
  }
  if (o.name === 'recon') {
    const a = asset(o.asset);
    const row = RES().rows.find((r) => r.id === a.id);
    const typed = UI.reconVal != null ? parseCents(UI.reconVal) : null;
    const diff = typed == null ? null : typed - row.balance;
    return wrap('对账：和银行里的数字对一下', `<p class="muted">系统算出「${esc(a.name)}」截至 ${md(S.today)} 是 <b class="num">${Y(row.balance)}</b>。打开银行 App，把真实余额填在下面。</p>
      ${field('银行里的实际余额', `<div class="pre l"><span>¥</span><input class="in" id="recon-in" inputmode="decimal" autocomplete="off" placeholder="例如 ${centsInput(row.balance)}" value="${esc(UI.reconVal ?? '')}" data-bind="recon" data-k="recon-in"></div>`)}
      <div class="impact" id="recon-impact">${reconImpact(diff)}</div>`,
      `<button class="btn" type="button" data-act="dlg-close">取消</button><button class="btn primary" type="button" data-act="recon-save" data-asset="${a.id}" id="recon-save" ${diff == null || diff === 0 ? 'disabled' : ''}>生成差额调整</button>`);
  }
  return '';
}
function reconImpact(diff) {
  if (diff == null) return '<span class="muted">填写后会显示差额。</span>';
  if (diff === 0) return '<b>一致</b>，不需要调整。';
  return `差额 <b class="num">${Y(diff, { sign: true })}</b>。保存后生成一条<b>「对账调整」</b>记录（可作废），建档的基准日期不变，当月已记的投入进度也不受影响。`;
}

/* ---------- 路由 ---------- */
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [name, qs = ''] = raw.split('?');
  return { name: ROUTES.includes(name) ? name : 'overview', params: new URLSearchParams(qs) };
}
function applyParams(q) {
  if (q.get('still')) document.documentElement.classList.add('still');
  if (q.get('demo') && DEMOS[q.get('demo')] && q.get('demo') !== S.demo) resetDemo(q.get('demo'));
  if (q.get('theme')) UI.theme = q.get('theme') === 'dark' ? 'dark' : 'light';
  if (q.get('notes')) UI.notes = q.get('notes') === '1';
  if (q.get('filter')) UI.filter = q.get('filter');
  if (q.get('hh') === 'dirty') {
    UI.hh.name = '陈家的家庭财务';
    UI.hh.income = 1650000;
    UI.hh.assets[0].amount = 9760000;
    UI.hh.assets[0].observed_on = shiftDay(S.today, -1);
  }
  if (q.get('lever')) {
    const [gid, kind] = q.get('lever').split(':');
    const R = RES();
    const g = R.goals.find((x) => x.id === gid);
    const lv = g && levers(g, R, S.household, planParams(), S.today);
    if (lv && lv[kind]) UI.scen.A = scenFromParams(mergeParams(planParams(), lv[kind].patch));
  }
  if (q.get('scenB') === '1') {
    UI.scen.A = scenFromParams(mergeParams(planParams(), { monthly: { study: 233334 } }));
    UI.scen.B = scenFromParams(mergeParams(planParams(), { extend: 2 }));
    UI.scen.tab = 'A';
  }
  if (q.get('scenerr') === '1') { UI.scen.A.ret = '80'; }
  if (q.get('lock') === '1') { UI.scen.A.monthly.family = '1000'; }
  if (q.get('draftplan') === '1') {
    const { params } = scenParse(UI.scen.A);
    S.pending = { id: 'draft2', rev: S.rev, params, created_at: `${S.today} 19:05` };
  }
  if (q.get('consent') === '1') UI.draftConsent = true;
  if (q.get('sheet')) {
    const kind = q.get('kind') || 'expense';
    if (q.get('sheet') === 'record') {
      if (q.get('action')) {
        const a = ACTS().find((x) => x.id === q.get('action')) || ACTS().find((x) => x.status !== 'completed');
        UI.drafts = a ? [draftFromAction(a)] : [newDraft(kind)];
      } else UI.drafts = [newDraft(kind)];
      if (q.get('drafts') === '2') {
        const a2 = ACTS().find((x) => x.status !== 'completed');
        UI.drafts = [a2 ? draftFromAction(a2) : newDraft('contribution'), newDraft('expense', { amount: '128.50', note: '超市' })];
        UI.cur = 0;
      }
      if (q.get('err') === '1') {
        UI.drafts[UI.cur].date = S.household.assets[0].observed_on;
        UI.drafts[UI.cur].amount = UI.drafts[UI.cur].amount || '3000';
