<script>
/* 首帧前定好主题：读上次的选择，没有就跟随系统（与项目 index.html 同一思路） */
(function () {
  var t = null;
  try { var v = JSON.parse(localStorage.getItem('finunity-optimized-proto-v1') || 'null'); t = v && v.theme; } catch (e) {}
  var dark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
