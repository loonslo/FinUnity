name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly (Monday 05:23 Asia/Shanghai): the lockfile and the toolchain drift even when nobody pushes.
    - cron: "23 21 * * 0"

permissions:
  contents: read

jobs:
  web:
    name: Lint, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Tests
        run: npm test
