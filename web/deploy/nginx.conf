server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Serve canonical policy URLs directly; avoid an upstream HTTP slash redirect.
  location = /privacy {
    try_files /privacy/index.html =404;
  }
  location = /terms {
    try_files /terms/index.html =404;
  }
  location = /android-privacy {
    try_files /android-privacy/index.html =404;
  }

  # Crawl configuration must never fall back to the client application.
  location = /robots.txt {
    try_files /robots.txt =404;
  }
  location = /sitemap.xml {
    try_files /sitemap.xml =404;
  }

  # Public guide canonical URLs redirect without exposing the upstream HTTP origin.
  location = /product {
    absolute_redirect off;
    return 308 /about/;
  }
  location = /en/product {
    absolute_redirect off;
    return 308 /en/about/;
  }
  location = /guides/multi-currency {
    absolute_redirect off;
    return 308 /guides/multi-currency/;
  }
  location = /en/guides/multi-currency {
    absolute_redirect off;
    return 308 /en/guides/multi-currency/;
  }
  location = /guides/holding-import {
    absolute_redirect off;
    return 308 /guides/holding-import/;
  }
  location = /en/guides/holding-import {
    absolute_redirect off;
    return 308 /en/guides/holding-import/;
  }

  location = /product/ { absolute_redirect off; return 308 /about/; }
  location = /en/product/ { absolute_redirect off; return 308 /en/about/; }
  location = /en { absolute_redirect off; return 308 /en/; }
  location = /en/ { try_files /en/index.html =404; }
  location = / { try_files /home.html =404; }
  location = /about { absolute_redirect off; return 308 /about/; }
  location = /en/about { absolute_redirect off; return 308 /en/about/; }
  location = /about/ { try_files /about/index.html =404; }
  location = /en/about/ { try_files /en/about/index.html =404; }
  # Only routes declared in App.tsx can use the SPA shell on a direct reload.
  location ~ ^/(?:login|register|demo(?:/(?:holdings|flows))?|app(?:/(?:holdings|flows))?)/?$ {
    try_files /index.html =404;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    try_files $uri $uri/ =404;
  }
}
