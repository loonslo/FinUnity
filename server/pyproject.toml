[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "finunity-server"
version = "0.1.0"
description = "FinUnity holding screenshot recognition API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "email-validator>=2.2,<3",
    "openai>=1.68,<3",
    "pillow>=11,<13",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]
paddleocr = [
    "numpy>=1.26,<3",
    "paddleocr>=3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finunity_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
